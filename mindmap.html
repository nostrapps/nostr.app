    <!-- Toolbar Setup -->
    <script>
      ;(r => {
        setTimeout(r)
      })(() => {
        const { markmap, mm } = window
        const toolbar = new markmap.Toolbar()
        toolbar.attach(mm)
        const el = toolbar.render()
        el.setAttribute('style', 'position:absolute;bottom:20px;right:20px')
        document.body.append(el)
      })
    </script>

    <!-- Mindmap Initialization -->
    <script>
      ;(async () => {
        try {
          // Check for uri parameter in query string
          const urlParams = new URLSearchParams(window.location.search)
          const uri = urlParams.get('uri')

          let mindmapData

          if (uri) {
            // Fetch data from the provided URI
            console.log('Fetching mindmap data from:', uri)
            const response = await fetch(uri)
            if (!response.ok) {
              throw new Error(
                `Failed to fetch data from ${uri}: ${response.status} ${response.statusText}`
              )
            }
            mindmapData = await response.json()
          } else {
            // Get mindmap data from the data island (fallback)
            const mindmapDataElement = document.getElementById('mindmap-data')
            mindmapData = JSON.parse(mindmapDataElement.textContent)
          }

          // Initialize markmap
          const markmap = window.markmap
          window.mm = markmap.Markmap.create(
            'svg#mindmap',
            markmap.deriveOptions(null),
            mindmapData
          )
        } catch (error) {
          console.error('Error loading mindmap data:', error)
          // Fallback to data island on error
          try {
            const mindmapDataElement = document.getElementById('mindmap-data')
            const mindmapData = JSON.parse(mindmapDataElement.textContent)
            const markmap = window.markmap
            window.mm = markmap.Markmap.create(
              'svg#mindmap',
              markmap.deriveOptions(null),
              mindmapData
            )
          } catch (fallbackError) {
            console.error('Error loading fallback data:', fallbackError)
            document.body.innerHTML =
              '<div style="padding: 20px; color: red;">Error loading mindmap data. Please check the console for details.</div>'
          }
        }
      })()
