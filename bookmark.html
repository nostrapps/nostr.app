<!--
/**
 * bookmark.html - Bookmark Management Application
 * 
 * This file provides a complete bookmark management system with the following features:
 * - Cloud storage via nosdav.net with localStorage fallback
 * - Category-based organization with filtering
 * - Search functionality across titles and URLs
 * - TypeRegistration support for multiple bookmark collections
 * - Modern responsive UI with Tailwind CSS
 * 
 * Storage Strategy:
 * - Primary: nosdav cloud storage (https://nosdav.net/{pubkey}/public/bookmark/bookmark.json)
 * - Fallback: Browser localStorage
 * - Supports custom URIs via query parameters or TypeRegistrations
 * 
 * Referenced components: navbar.js, nosdav-shim.js
 */
-->
<!DOCTYPE html>
<html lang="en">
  <!-- ================================================================ -->
  <!-- -                         HTML HEAD                            - -->
  <!-- ================================================================ -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS Variables and Styles -->
    <style>
      /* ============================================================ */
      /* -                    CSS VARIABLES                        - */
      /* ============================================================ */
      :root {
        /* Color scheme */
        --primary: #3b82f6;
        --primary-dark: #2563eb;
        --primary-light: #dbeafe;
        --secondary: #93c5fd;
        --accent: #3b82f6;
        --text-light: #ffffff;
        --text-dark: #334155;
        --card-bg: #ffffff;
        --body-bg: #f8fafc;

        /* Layout dimensions */
        --sidebar-width: 230px;
        --header-height: 60px;

        /* Shadows and borders */
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.05);
        --radius-sm: 6px;
        --radius-md: 8px;
      }

      /* ============================================================ */
      /* -                   GLOBAL STYLES                         - */
      /* ============================================================ */
      body {
        background-color: var(--body-bg);
        min-height: 100vh;
      }

      /* ============================================================ */
      /* -                  BOOKMARK CARD STYLES                   - */
      /* ============================================================ */
      .bookmark-card {
        transition: all 0.2s ease;
        border: 1px solid #e5e7eb;
      }
      .bookmark-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }

      /* ============================================================ */
      /* -                    FORM STYLES                          - */
      /* ============================================================ */
      .add-form {
        background: #ffffff;
      }
      /* ============================================================ */
      /* -                 CATEGORY BADGE STYLES                   - */
      /* ============================================================ */
      .category-badge {
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
        border-radius: 9999px;
      }

      /* Category-specific color schemes */
      .category-badge.development {
        background-color: #dbeafe;
        color: #1e40af;
      }
      .category-badge.design {
        background-color: #fce7f3;
        color: #9d174d;
      }
      .category-badge.productivity {
        background-color: #d1fae5;
        color: #065f46;
      }
      .category-badge.education {
        background-color: #fef3c7;
        color: #92400e;
      }
      .category-badge.entertainment {
        background-color: #e0e7ff;
        color: #3730a3;
      }
      .category-badge.apps {
        background-color: #fee2e2;
        color: #991b1b;
      }
      .category-badge.news {
        background-color: #f3f4f6;
        color: #1f2937;
      }
      .category-badge.other {
        background-color: #e5e7eb;
        color: #4b5563;
      }
      /* ============================================================ */
      /* -                  BUTTON STYLES                          - */
      /* ============================================================ */
      .add-bookmark-btn {
        background-color: var(--primary);
        color: white;
        border-radius: var(--radius-sm);
        padding: 0.5rem 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 500;
        transition: all 0.2s ease;
      }
      .add-bookmark-btn:hover {
        background-color: var(--primary-dark);
      }

      /* ============================================================ */
      /* -                   INPUT STYLES                          - */
      /* ============================================================ */
      .search-input {
        border: 1px solid #e5e7eb;
        border-radius: var(--radius-sm);
        padding: 0.5rem 1rem;
        padding-right: 2.5rem;
        width: 100%;
        max-width: 300px;
      }
      .search-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
      }

      /* ============================================================ */
      /* -                 DROPDOWN STYLES                         - */
      /* ============================================================ */
      .categories-dropdown {
        border: 1px solid #e5e7eb;
        border-radius: var(--radius-sm);
        padding: 0.5rem 1rem;
        background-color: white;
        min-width: 180px;
      }
      .categories-dropdown:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
      }
    </style>
  </head>

  <!-- ================================================================ -->
  <!-- -                         HTML BODY                            - -->
  <!-- ================================================================ -->
  <body class="font-sans">
    <!-- Application mount point for Preact components -->
    <div id="app"></div>

    <!-- ============================================================ -->
    <!-- -                    JAVASCRIPT MODULE                    - -->
    <!-- ============================================================ -->
    <script type="module" src="bookmark.js"></script>
  </body>
</html>
