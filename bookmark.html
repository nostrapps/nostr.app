<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(135deg, #e0f7fa 0%, #d8b5ff 100%);
        min-height: 100vh;
      }
      .bookmark-card {
        transition: all 0.3s ease;
      }
      .bookmark-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      }
      .add-form {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
      }
    </style>
  </head>
  <body class="font-sans">
    <div id="app"></div>

    <script type="module">
      import {
        h,
        render,
        Component
      } from 'https://unpkg.com/preact@10.13.1/dist/preact.module.js'
      import htm from 'https://unpkg.com/htm@3.1.1/dist/htm.module.js'
      import Navbar from './navbar.js'
      import './nosdav-shim.js'
      import * as secp256k1 from 'https://cdn.jsdelivr.net/npm/@noble/secp256k1@1.7.1/+esm'

      window.secp256k1 = secp256k1

      // Initialize htm with Preact
      const html = htm.bind(h)

      class BookmarkApp extends Component {
        constructor() {
          super()
          this.state = {
            bookmarks: [],
            newBookmark: { title: '', url: '' }
          }
          this.loadBookmarks()
        }

        componentDidMount() {
          this.loadBookmarks()
        }

        // Storage handling
        getStorageProvider() {
          // Use nosdav.net directly as the primary storage solution
          console.log('Using nosdav.net as primary storage')
          return {
            type: 'nosdav',
            isPrimary: true,
            save: async data => {
              try {
                const pubkey = localStorage.getItem('pubkey')
                if (!pubkey) {
                  console.error('No pubkey found for nosdav storage')
                  return false
                }

                const url = `https://nosdav.net/${pubkey}/bookmarks.json`
                const response = await fetch(url, {
                  method: 'PUT',
                  headers: {
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(data)
                })

                if (!response.ok) throw new Error('Network response was not ok')
                console.log('Bookmarks saved to nosdav successfully')
                return true
              } catch (e) {
                console.error('Error saving to nosdav:', e)
                // Fall back to localStorage if nosdav fails
                if (typeof localStorage !== 'undefined') {
                  try {
                    localStorage.setItem('bookmarks', JSON.stringify(data))
                    console.log('Bookmarks saved to localStorage as fallback')
                    return true
                  } catch (localErr) {
                    console.error('Error saving to localStorage:', localErr)
                  }
                }
                return false
              }
            },
            load: async () => {
              try {
                const pubkey = localStorage.getItem('pubkey')
                if (!pubkey) {
                  console.error('No pubkey found for nosdav storage')
                  return []
                }

                const url = `https://nosdav.net/${pubkey}/bookmarks.json`
                const response = await fetch(url)

                if (response.status === 404) {
                  return []
                }

                if (!response.ok) throw new Error('Network response was not ok')
                const bookmarks = await response.json()
                return bookmarks
              } catch (e) {
                console.error('Error loading from nosdav:', e)
                // Try to load from localStorage if nosdav fails
                if (typeof localStorage !== 'undefined') {
                  try {
                    const data = localStorage.getItem('bookmarks')
                    if (data) {
                      console.log(
                        'Loaded bookmarks from localStorage as fallback'
                      )
                      return JSON.parse(data)
                    }
                  } catch (localErr) {
                    console.error('Error loading from localStorage:', localErr)
                  }
                }
                return []
              }
            }
          }
        }

        async saveBookmarks() {
          const storage = this.getStorageProvider()
          await storage.save(this.state.bookmarks)
          console.log(`Bookmarks saved to ${storage.type}`)
        }

        async loadBookmarks() {
          const storage = this.getStorageProvider()
          const bookmarks = await storage.load()

          // Ensure all bookmarks have the @type property
          const updatedBookmarks = bookmarks.map(bookmark => ({
            ...bookmark,
            '@type': bookmark['@type'] || 'Bookmark'
          }))

          this.setState({ bookmarks: updatedBookmarks })
          console.log(`Bookmarks loaded from ${storage.type}`)

          // Save if any bookmarks were updated with @type
          if (JSON.stringify(bookmarks) !== JSON.stringify(updatedBookmarks)) {
            this.saveBookmarks()
          }
        }

        handleInputChange = e => {
          const { name, value } = e.target
          this.setState({
            newBookmark: {
              ...this.state.newBookmark,
              [name]: value
            }
          })
        }

        addBookmark = e => {
          e.preventDefault()
          const { title, url } = this.state.newBookmark

          if (!title || !url) return

          // Add http:// if missing
          let formattedUrl = url
          if (!url.startsWith('http://') && !url.startsWith('https://')) {
            formattedUrl = 'https://' + url
          }

          const newBookmarks = [
            ...this.state.bookmarks,
            {
              id: Date.now(),
              title,
              url: formattedUrl,
              createdAt: new Date().toISOString(),
              read: false,
              '@type': 'Bookmark'
            }
          ]

          this.setState(
            {
              bookmarks: newBookmarks,
              newBookmark: { title: '', url: '' }
            },
            () => this.saveBookmarks()
          )
        }

        removeBookmark = id => {
          const bookmarks = this.state.bookmarks.filter(
            bookmark => bookmark.id !== id
          )
          this.setState({ bookmarks }, () => this.saveBookmarks())
        }

        toggleReadStatus = id => {
          const bookmarks = this.state.bookmarks.map(bookmark =>
            bookmark.id === id
              ? { ...bookmark, read: !bookmark.read }
              : bookmark
          )
          this.setState({ bookmarks }, () => this.saveBookmarks())
        }

        render() {
          const storage = this.getStorageProvider()
          return html`
            <div class="min-h-screen flex flex-col">
              <${Navbar} />

              <main class="container mx-auto px-4 py-8 flex-grow">
                <div class="text-center mb-12">
                  <h1 class="text-4xl font-bold text-indigo-800 mb-2">
                    Bookmark Manager
                  </h1>
                  <p class="text-lg text-indigo-600">
                    Keep your favorite sites organized
                  </p>
                  ${storage.type === 'nosdav'
                    ? html`<div
                        class="mt-2 text-sm text-green-600 bg-green-100 rounded-full px-3 py-1 inline-block"
                      >
                        Using nosdav cloud storage
                      </div>`
                    : html`<div
                        class="mt-2 text-sm text-yellow-600 bg-yellow-100 rounded-full px-3 py-1 inline-block"
                      >
                        Using ${storage.type} storage (nosdav not available)
                      </div>`}
                </div>

                <div
                  class="max-w-md mx-auto add-form rounded-lg shadow-lg p-6 mb-10"
                >
                  <h2 class="text-2xl font-semibold text-indigo-700 mb-4">
                    Add New Bookmark
                  </h2>
                  <form onSubmit=${this.addBookmark} class="space-y-4">
                    <div>
                      <input
                        type="text"
                        name="title"
                        value=${this.state.newBookmark.title}
                        onInput=${this.handleInputChange}
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
                        placeholder="Website Title"
                        required
                      />
                    </div>
                    <div>
                      <input
                        type="text"
                        name="url"
                        value=${this.state.newBookmark.url}
                        onInput=${this.handleInputChange}
                        class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
                        placeholder="Website URL"
                        required
                      />
                    </div>
                    <button
                      type="submit"
                      class="w-full bg-indigo-500 text-white py-3 px-4 rounded-lg hover:bg-indigo-600 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      Add Bookmark
                    </button>
                  </form>
                </div>

                <div class="max-w-4xl mx-auto">
                  <h2
                    class="text-2xl font-semibold text-indigo-700 mb-6 text-center"
                  >
                    Your Bookmarks
                  </h2>

                  ${this.state.bookmarks.length === 0
                    ? html`
                        <div class="text-center py-10 text-indigo-500">
                          <p>No bookmarks yet. Add your first one above!</p>
                        </div>
                      `
                    : html`
                        <div
                          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
                        >
                          ${this.state.bookmarks.map(
                            bookmark => html`
                              <div
                                key=${bookmark.id}
                                class="bookmark-card bg-white rounded-lg shadow-md overflow-hidden ${bookmark.read
                                  ? 'bg-gray-50'
                                  : ''}"
                              >
                                <div class="p-5">
                                  <div
                                    class="flex justify-between items-center mb-2"
                                  >
                                    <h3
                                      class="font-bold text-lg text-indigo-700 truncate ${bookmark.read
                                        ? 'text-indigo-500'
                                        : ''}"
                                    >
                                      ${bookmark.title}
                                    </h3>
                                    <span
                                      class="text-xs px-2 py-1 rounded-full ${bookmark.read
                                        ? 'bg-green-100 text-green-800'
                                        : 'bg-yellow-100 text-yellow-800'}"
                                    >
                                      ${bookmark.read ? 'Read' : 'Unread'}
                                    </span>
                                  </div>
                                  <a
                                    href=${bookmark.url}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="text-blue-500 hover:text-blue-700 text-sm block truncate mb-3"
                                  >
                                    ${bookmark.url}
                                  </a>
                                  <div
                                    class="flex justify-between items-center"
                                  >
                                    <span class="text-xs text-gray-500">
                                      ${new Date(
                                        bookmark.createdAt
                                      ).toLocaleDateString()}
                                    </span>
                                    <div class="flex space-x-2">
                                      <button
                                        onClick=${() =>
                                          this.toggleReadStatus(bookmark.id)}
                                        class="text-gray-500 hover:text-indigo-700 focus:outline-none"
                                        aria-label="${bookmark.read
                                          ? 'Mark as unread'
                                          : 'Mark as read'}"
                                      >
                                        <svg
                                          xmlns="http://www.w3.org/2000/svg"
                                          class="h-5 w-5"
                                          fill="none"
                                          viewBox="0 0 24 24"
                                          stroke="currentColor"
                                        >
                                          <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            stroke-width="2"
                                            d="${bookmark.read
                                              ? 'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253'
                                              : 'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253'}"
                                          />
                                        </svg>
                                      </button>
                                      <button
                                        onClick=${() =>
                                          this.removeBookmark(bookmark.id)}
                                        class="text-red-500 hover:text-red-700 focus:outline-none"
                                        aria-label="Delete bookmark"
                                      >
                                        <svg
                                          xmlns="http://www.w3.org/2000/svg"
                                          class="h-5 w-5"
                                          fill="none"
                                          viewBox="0 0 24 24"
                                          stroke="currentColor"
                                        >
                                          <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            stroke-width="2"
                                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                                          />
                                        </svg>
                                      </button>
                                    </div>
                                  </div>
                                </div>
                              </div>
                            `
                          )}
                        </div>
                      `}
                </div>
              </main>

              <footer class="text-center py-6 text-indigo-600">
                <p>© ${new Date().getFullYear()} Bookmark Manager</p>
              </footer>
            </div>
          `
        }
      }

      // Render the app
      render(html`<${BookmarkApp} />`, document.getElementById('app'))
    </script>
  </body>
</html>
