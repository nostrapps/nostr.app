<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --primary: #3b82f6;
        --primary-dark: #2563eb;
        --primary-light: #dbeafe;
        --secondary: #93c5fd;
        --accent: #3b82f6;
        --text-light: #ffffff;
        --text-dark: #334155;
        --card-bg: #ffffff;
        --body-bg: #f8fafc;
        --sidebar-width: 230px;
        --header-height: 60px;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.05);
        --radius-sm: 6px;
        --radius-md: 8px;
      }

      body {
        background-color: var(--body-bg);
        min-height: 100vh;
      }
      .bookmark-card {
        transition: all 0.2s ease;
        border: 1px solid #e5e7eb;
      }
      .bookmark-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }
      .add-form {
        background: #ffffff;
      }
      .category-badge {
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
        border-radius: 9999px;
      }
      .category-badge.development {
        background-color: #dbeafe;
        color: #1e40af;
      }
      .category-badge.design {
        background-color: #fce7f3;
        color: #9d174d;
      }
      .category-badge.productivity {
        background-color: #d1fae5;
        color: #065f46;
      }
      .category-badge.education {
        background-color: #fef3c7;
        color: #92400e;
      }
      .category-badge.entertainment {
        background-color: #e0e7ff;
        color: #3730a3;
      }
      .category-badge.social {
        background-color: #fee2e2;
        color: #991b1b;
      }
      .category-badge.news {
        background-color: #f3f4f6;
        color: #1f2937;
      }
      .category-badge.other {
        background-color: #e5e7eb;
        color: #4b5563;
      }
      .add-bookmark-btn {
        background-color: var(--primary);
        color: white;
        border-radius: var(--radius-sm);
        padding: 0.5rem 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 500;
        transition: all 0.2s ease;
      }
      .add-bookmark-btn:hover {
        background-color: var(--primary-dark);
      }
      .search-input {
        border: 1px solid #e5e7eb;
        border-radius: var(--radius-sm);
        padding: 0.5rem 1rem;
        padding-right: 2.5rem;
        width: 100%;
        max-width: 300px;
      }
      .search-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
      }
      .categories-dropdown {
        border: 1px solid #e5e7eb;
        border-radius: var(--radius-sm);
        padding: 0.5rem 1rem;
        background-color: white;
        min-width: 180px;
      }
      .categories-dropdown:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
      }
    </style>
  </head>
  <body class="font-sans">
    <div id="app"></div>

    <script type="module">
      import {
        h,
        render,
        Component
      } from 'https://unpkg.com/preact@10.13.1/dist/preact.module.js'
      import htm from 'https://unpkg.com/htm@3.1.1/dist/htm.module.js'
      import Navbar from './navbar.js'
      import './nosdav-shim.js'
      import * as secp256k1 from 'https://cdn.jsdelivr.net/npm/@noble/secp256k1@1.7.1/+esm'

      window.secp256k1 = secp256k1

      // Initialize htm with Preact
      const html = htm.bind(h)

      // Default categories
      const DEFAULT_CATEGORIES = [
        'Development',
        'Design',
        'Productivity',
        'Education',
        'Entertainment',
        'Social',
        'News',
        'Other'
      ]

      class BookmarkApp extends Component {
        constructor() {
          super()
          this.state = {
            bookmarks: [],
            newBookmark: { title: '', url: '', category: 'Development' },
            selectedCategory: 'All Categories',
            searchQuery: ''
          }
          this.loadBookmarks()
        }

        componentDidMount() {
          this.loadBookmarks()
        }

        // Storage handling
        getStorageProvider() {
          // Use nosdav.net directly as the primary storage solution
          console.log('Using nosdav.net as primary storage')
          return {
            type: 'nosdav',
            isPrimary: true,
            save: async data => {
              try {
                const pubkey = localStorage.getItem('pubkey')
                if (!pubkey) {
                  console.error('No pubkey found for nosdav storage')
                  return false
                }

                const url = `https://nosdav.net/${pubkey}/bookmarks.json`
                const response = await fetch(url, {
                  method: 'PUT',
                  headers: {
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(data)
                })

                if (!response.ok) throw new Error('Network response was not ok')
                console.log('Bookmarks saved to nosdav successfully')
                return true
              } catch (e) {
                console.error('Error saving to nosdav:', e)
                // Fall back to localStorage if nosdav fails
                if (typeof localStorage !== 'undefined') {
                  try {
                    localStorage.setItem('bookmarks', JSON.stringify(data))
                    console.log('Bookmarks saved to localStorage as fallback')
                    return true
                  } catch (localErr) {
                    console.error('Error saving to localStorage:', localErr)
                  }
                }
                return false
              }
            },
            load: async () => {
              try {
                const pubkey = localStorage.getItem('pubkey')
                if (!pubkey) {
                  console.error('No pubkey found for nosdav storage')
                  return []
                }

                const url = `https://nosdav.net/${pubkey}/bookmarks.json`
                const response = await fetch(url)

                if (response.status === 404) {
                  return []
                }

                if (!response.ok) throw new Error('Network response was not ok')
                const bookmarks = await response.json()
                return bookmarks
              } catch (e) {
                console.error('Error loading from nosdav:', e)
                // Try to load from localStorage if nosdav fails
                if (typeof localStorage !== 'undefined') {
                  try {
                    const data = localStorage.getItem('bookmarks')
                    if (data) {
                      console.log(
                        'Loaded bookmarks from localStorage as fallback'
                      )
                      return JSON.parse(data)
                    }
                  } catch (localErr) {
                    console.error('Error loading from localStorage:', localErr)
                  }
                }
                return []
              }
            }
          }
        }

        async saveBookmarks() {
          const storage = this.getStorageProvider()
          await storage.save(this.state.bookmarks)
          console.log(`Bookmarks saved to ${storage.type}`)
        }

        async loadBookmarks() {
          const storage = this.getStorageProvider()
          const bookmarks = await storage.load()

          // Ensure all bookmarks have the @type property and a category
          const updatedBookmarks = bookmarks.map(bookmark => ({
            ...bookmark,
            '@type': bookmark['@type'] || 'Bookmark',
            category: bookmark.category || 'Development'
          }))

          this.setState({ bookmarks: updatedBookmarks })
          console.log(`Bookmarks loaded from ${storage.type}`)

          // Save if any bookmarks were updated with @type or category
          if (JSON.stringify(bookmarks) !== JSON.stringify(updatedBookmarks)) {
            this.saveBookmarks()
          }
        }

        handleInputChange = e => {
          const { name, value } = e.target
          this.setState({
            newBookmark: {
              ...this.state.newBookmark,
              [name]: value
            }
          })
        }

        handleCategoryChange = e => {
          this.setState({ selectedCategory: e.target.value })
        }

        handleSearchChange = e => {
          this.setState({ searchQuery: e.target.value })
        }

        addBookmark = e => {
          e.preventDefault()
          const { title, url, category } = this.state.newBookmark

          if (!title || !url) return

          // Add http:// if missing
          let formattedUrl = url
          if (!url.startsWith('http://') && !url.startsWith('https://')) {
            formattedUrl = 'https://' + url
          }

          const newBookmarks = [
            ...this.state.bookmarks,
            {
              id: Date.now(),
              title,
              url: formattedUrl,
              category,
              createdAt: new Date().toISOString(),
              read: false,
              '@type': 'Bookmark'
            }
          ]

          this.setState(
            {
              bookmarks: newBookmarks,
              newBookmark: {
                title: '',
                url: '',
                category: this.state.newBookmark.category
              }
            },
            () => this.saveBookmarks()
          )
        }

        removeBookmark = id => {
          const bookmarks = this.state.bookmarks.filter(
            bookmark => bookmark.id !== id
          )
          this.setState({ bookmarks }, () => this.saveBookmarks())
        }

        toggleReadStatus = id => {
          const bookmarks = this.state.bookmarks.map(bookmark =>
            bookmark.id === id
              ? { ...bookmark, read: !bookmark.read }
              : bookmark
          )
          this.setState({ bookmarks }, () => this.saveBookmarks())
        }

        openStorageFile = () => {
          const pubkey = localStorage.getItem('pubkey')
          if (pubkey) {
            const url = `https://nosdav.net/${pubkey}/bookmarks.json`
            window.open(url, '_blank')
          } else {
            alert('No pubkey found. Cannot open storage file.')
          }
        }

        getFilteredBookmarks() {
          const { bookmarks, selectedCategory, searchQuery } = this.state

          return bookmarks.filter(bookmark => {
            // Filter by category
            const categoryMatch =
              selectedCategory === 'All Categories' ||
              bookmark.category === selectedCategory

            // Filter by search query
            const searchMatch =
              !searchQuery ||
              bookmark.title
                .toLowerCase()
                .includes(searchQuery.toLowerCase()) ||
              bookmark.url.toLowerCase().includes(searchQuery.toLowerCase())

            return categoryMatch && searchMatch
          })
        }

        render() {
          const storage = this.getStorageProvider()
          const filteredBookmarks = this.getFilteredBookmarks()

          return html`
            <div class="min-h-screen flex flex-col">
              <${Navbar} />

              <main class="container mx-auto px-4 py-6 flex-grow max-w-6xl">
                <div class="text-left mb-8">
                  <h1
                    class="text-3xl font-bold mb-1"
                    style="color: var(--text-dark);"
                  >
                    Bookmarks
                  </h1>
                  <p class="text-base text-gray-500">
                    Organize and access your favorite websites
                  </p>
                  ${storage.type === 'nosdav'
                    ? html`<div
                        class="mt-2 text-sm text-blue-600 bg-blue-50 rounded-md px-3 py-1 inline-block"
                      >
                        Using nosdav cloud storage
                        <button
                          onClick=${this.openStorageFile}
                          class="ml-2 text-blue-700 hover:text-blue-800 text-xs font-medium"
                          title="Open storage file in new tab"
                        >
                          View File
                        </button>
                      </div>`
                    : html`<div
                        class="mt-2 text-sm text-yellow-600 bg-yellow-50 rounded-md px-3 py-1 inline-block"
                      >
                        Using ${storage.type} storage (nosdav not available)
                      </div>`}
                </div>

                <div class="flex justify-between items-center mb-6">
                  <select
                    class="categories-dropdown"
                    value=${this.state.selectedCategory}
                    onChange=${this.handleCategoryChange}
                  >
                    <option value="All Categories">All Categories</option>
                    ${DEFAULT_CATEGORIES.map(
                      category =>
                        html`<option value=${category}>${category}</option>`
                    )}
                  </select>

                  <div class="relative">
                    <input
                      type="text"
                      placeholder="Search bookmarks..."
                      class="search-input"
                      value=${this.state.searchQuery}
                      onInput=${this.handleSearchChange}
                    />
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-4 w-4 absolute right-3 top-2.5 text-gray-400"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                      />
                    </svg>
                  </div>

                  <button
                    class="add-bookmark-btn"
                    data-bs-toggle="modal"
                    data-bs-target="#addBookmarkModal"
                    onClick=${() => {
                      document.getElementById('addBookmarkForm').style.display =
                        document.getElementById('addBookmarkForm').style
                          .display === 'none'
                          ? 'block'
                          : 'none'
                    }}
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-5 w-5"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 4v16m8-8H4"
                      />
                    </svg>
                    Add Bookmark
                  </button>
                </div>

                <div id="addBookmarkForm" class="mb-8" style="display: none;">
                  <div
                    class="add-form rounded-lg shadow-sm p-6 border border-gray-200"
                    style="border-radius: var(--radius-md);"
                  >
                    <div class="flex justify-between items-center mb-4">
                      <h2
                        class="text-lg font-semibold"
                        style="color: var(--text-dark);"
                      >
                        Add Bookmark
                      </h2>
                      <button
                        class="text-gray-400 hover:text-gray-600"
                        onClick=${() => {
                          document.getElementById(
                            'addBookmarkForm'
                          ).style.display = 'none'
                        }}
                      >
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          class="h-5 w-5"
                          fill="none"
                          viewBox="0 0 24 24"
                          stroke="currentColor"
                        >
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M6 18L18 6M6 6l12 12"
                          />
                        </svg>
                      </button>
                    </div>
                    <form onSubmit=${this.addBookmark} class="space-y-4">
                      <div>
                        <label
                          class="block text-sm font-medium text-gray-700 mb-1"
                          >Title</label
                        >
                        <input
                          type="text"
                          name="title"
                          value=${this.state.newBookmark.title}
                          onInput=${this.handleInputChange}
                          class="w-full px-3 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                          placeholder="Website name"
                          required
                        />
                      </div>
                      <div>
                        <label
                          class="block text-sm font-medium text-gray-700 mb-1"
                          >URL</label
                        >
                        <input
                          type="text"
                          name="url"
                          value=${this.state.newBookmark.url}
                          onInput=${this.handleInputChange}
                          class="w-full px-3 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                          placeholder="https://example.com"
                          required
                        />
                      </div>
                      <div>
                        <label
                          class="block text-sm font-medium text-gray-700 mb-1"
                          >Category</label
                        >
                        <select
                          name="category"
                          value=${this.state.newBookmark.category}
                          onInput=${this.handleInputChange}
                          class="w-full px-3 py-2 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        >
                          ${DEFAULT_CATEGORIES.map(
                            category =>
                              html`<option value=${category}>
                                ${category}
                              </option>`
                          )}
                        </select>
                      </div>
                      <div class="flex justify-end">
                        <button
                          type="button"
                          class="mr-2 py-2 px-4 border border-gray-300 text-gray-700 font-medium rounded-md transition duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2"
                          onClick=${() => {
                            document.getElementById(
                              'addBookmarkForm'
                            ).style.display = 'none'
                          }}
                        >
                          Cancel
                        </button>
                        <button
                          type="submit"
                          class="py-2 px-4 bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-md transition duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                        >
                          Save Bookmark
                        </button>
                      </div>
                    </form>
                  </div>
                </div>

                <div
                  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
                >
                  ${filteredBookmarks.length === 0
                    ? html`
                        <div
                          class="col-span-full text-center py-10 bg-white rounded-lg border border-gray-200"
                        >
                          <p class="text-gray-500">
                            No bookmarks found. Add your first one!
                          </p>
                        </div>
                      `
                    : filteredBookmarks.map(
                        bookmark => html`
                          <div
                            key=${bookmark.id}
                            class="bookmark-card bg-white rounded-lg overflow-hidden flex flex-col"
                          >
                            <div class="p-4">
                              <div
                                class="flex justify-between items-start mb-2"
                              >
                                <h3
                                  class="font-medium text-base truncate"
                                  style="color: var(--text-dark);"
                                >
                                  ${bookmark.title}
                                </h3>
                                <span
                                  class="ml-2 category-badge ${bookmark.category.toLowerCase()}"
                                >
                                  ${bookmark.category}
                                </span>
                              </div>
                              <a
                                href=${bookmark.url}
                                target="_blank"
                                rel="noopener noreferrer"
                                class="text-gray-500 hover:text-blue-600 text-sm block truncate mb-3"
                              >
                                ${bookmark.url}
                              </a>
                              <div class="flex justify-between items-center">
                                <div class="flex space-x-2">
                                  <a
                                    href=${bookmark.url}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="text-gray-400 hover:text-blue-500 focus:outline-none"
                                    aria-label="Open bookmark"
                                  >
                                    <svg
                                      xmlns="http://www.w3.org/2000/svg"
                                      class="h-5 w-5"
                                      fill="none"
                                      viewBox="0 0 24 24"
                                      stroke="currentColor"
                                    >
                                      <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
                                      />
                                    </svg>
                                  </a>
                                  <button
                                    onClick=${() =>
                                      this.removeBookmark(bookmark.id)}
                                    class="text-gray-400 hover:text-red-500 focus:outline-none"
                                    aria-label="Delete bookmark"
                                  >
                                    <svg
                                      xmlns="http://www.w3.org/2000/svg"
                                      class="h-5 w-5"
                                      fill="none"
                                      viewBox="0 0 24 24"
                                      stroke="currentColor"
                                    >
                                      <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                                      />
                                    </svg>
                                  </button>
                                </div>
                              </div>
                            </div>
                          </div>
                        `
                      )}
                </div>
              </main>

              <footer class="text-center py-4 text-gray-500 text-sm">
                <p>© ${new Date().getFullYear()} Bookmark Manager</p>
              </footer>
            </div>
          `
        }
      }

      // Add default bookmarks if none exist
      const addDefaultBookmarks = async () => {
        const storage = {
          load: async () => {
            try {
              const pubkey = localStorage.getItem('pubkey')
              if (!pubkey) return []

              const url = `https://nosdav.net/${pubkey}/bookmarks.json`
              const response = await fetch(url)
              if (response.status === 404) return []
              if (!response.ok) throw new Error('Network response was not ok')

              const bookmarks = await response.json()
              return bookmarks
            } catch (e) {
              const data = localStorage.getItem('bookmarks')
              if (data) return JSON.parse(data)
              return []
            }
          },
          save: async data => {
            try {
              const pubkey = localStorage.getItem('pubkey')
              if (!pubkey) {
                localStorage.setItem('bookmarks', JSON.stringify(data))
                return
              }

              const url = `https://nosdav.net/${pubkey}/bookmarks.json`
              await fetch(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
              })
            } catch (e) {
              localStorage.setItem('bookmarks', JSON.stringify(data))
            }
          }
        }

        const bookmarks = await storage.load()

        if (bookmarks.length === 0) {
          const defaultBookmarks = [
            {
              id: Date.now(),
              title: 'Vercel',
              url: 'https://vercel.com',
              category: 'Development',
              createdAt: new Date().toISOString(),
              read: false,
              '@type': 'Bookmark',
              description:
                'Deploy web projects with the best frontend developer experience and highest end-user performance.'
            },
            {
              id: Date.now() + 1,
              title: 'GitHub',
              url: 'https://github.com',
              category: 'Development',
              createdAt: new Date().toISOString(),
              read: false,
              '@type': 'Bookmark',
              description:
                'GitHub is where over 100 million developers shape the future of software, together.'
            },
            {
              id: Date.now() + 2,
              title: 'Figma',
              url: 'https://figma.com',
              category: 'Design',
              createdAt: new Date().toISOString(),
              read: false,
              '@type': 'Bookmark',
              description:
                'Figma connects everyone in the design process so teams can deliver better products faster.'
            }
          ]

          await storage.save(defaultBookmarks)
        }
      }

      // Add default bookmarks and render the app
      addDefaultBookmarks().then(() => {
        render(html`<${BookmarkApp} />`, document.getElementById('app'))
      })
    </script>
  </body>
</html>
