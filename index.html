<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              softBlue: '#8BBEE8',
              softPurple: '#B8A9E1'
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer utilities {
        .text-gradient {
          background-clip: text;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .hover-scale {
          transition: transform 0.3s ease;
        }
        .hover-scale:hover {
          transform: scale(1.05);
        }
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-white via-softBlue/10 to-softPurple/20 flex flex-col items-center justify-center p-6"
  >
    <div id="navbar" class="fixed top-0 left-0 right-0 z-10"></div>

    <div id="app" class="w-full max-w-3xl"></div>

    <script type="module" src="navbar.js"></script>

    <script type="module">
      import {
        h,
        render,
        Component
      } from 'https://unpkg.com/preact@10.13.1/dist/preact.module.js'
      import htm from 'https://unpkg.com/htm@3.1.1/dist/htm.module.js'

      // Initialize htm with Preact
      const html = htm.bind(h)

      class App extends Component {
        constructor() {
          super()
          this.state = {
            apps: [],
            loading: true,
            error: null
          }
        }

        componentDidMount() {
          // Fetch directory listing or use a predefined list
          // For demo purposes, we'll simulate fetching apps
          this.fetchApps()
        }

        async fetchApps() {
          try {
            // In a real app, you might fetch this from a server
            // For now, we'll simulate with a timeout
            await new Promise(resolve => setTimeout(resolve, 500))

            // This would normally come from an API or server
            const apps = [
              { name: 'Hello World', path: './helloworld.html' },
              { name: 'Todo App', path: './todo.html' },
              { name: 'Bookmark App', path: './bookmark.html' },
              { name: 'Pastebin App', path: './pastebin.html' }
            ]

            this.setState({ apps, loading: false })
          } catch (error) {
            this.setState({ error: 'Failed to load apps', loading: false })
          }
        }

        render() {
          const { apps, loading, error } = this.state

          if (loading) {
            return html`
              <div class="text-center">
                <div class="animate-pulse text-2xl text-softPurple">
                  Loading apps...
                </div>
              </div>
            `
          }

          if (error) {
            return html`
              <div class="text-center text-red-500">
                <h2 class="text-2xl font-bold mb-4">Error</h2>
                <p>${error}</p>
              </div>
            `
          }

          return html`
            <div class="text-center">
              <h1
                class="text-4xl md:text-5xl font-bold mb-8 text-gradient bg-gradient-to-r from-softBlue to-softPurple"
              >
                App Directory
              </h1>

              <p class="text-lg mb-10 text-gray-700">
                Browse and explore our collection of web applications
              </p>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                ${apps.map(
                  app => html`
                    <a
                      href=${app.path}
                      class="hover-scale block p-6 rounded-lg shadow-lg bg-white bg-opacity-80 backdrop-blur-sm
                                          border border-softPurple/20 transition-all duration-300 hover:shadow-xl"
                    >
                      <h2
                        class="text-xl font-semibold text-gradient bg-gradient-to-r from-softBlue to-softPurple"
                      >
                        ${app.name}
                      </h2>
                      <div class="mt-2 text-gray-600">Click to open</div>
                    </a>
                  `
                )}
              </div>

              <footer class="mt-16 text-gray-500 text-sm">
                Built with Preact and HTM
              </footer>
            </div>
          `
        }
      }

      // Render the app
      render(html`<${App} />`, document.getElementById('app'))
    </script>
  </body>
</html>
