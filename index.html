<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nostr.App</title>
    <style>
      :root {
        --primary: #4a6fa5;
        --primary-dark: #3a5683;
        --primary-light: #c5d5e5;
        --secondary: #8fb8de;
        --accent: #63c0f5;
        --text-light: #ffffff;
        --text-dark: #334155;
        --card-bg: #f0f7ff;
        --body-bg: #f8fafc;
        --sidebar-width: 230px;
        --header-height: 60px;
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
        --radius-sm: 6px;
        --radius-md: 12px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }

      body {
        background-color: var(--body-bg);
        color: var(--text-dark);
        line-height: 1.5;
      }

      .header {
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        color: var(--text-light);
        height: var(--header-height);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 25px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        box-shadow: var(--shadow-sm);
      }

      .logo {
        font-size: 26px;
        font-weight: bold;
        display: flex;
        align-items: center;
        letter-spacing: -0.5px;
      }

      .logo-dot {
        color: var(--accent);
        font-size: 32px;
        margin-left: -3px;
      }

      .theme-container {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .theme-select {
        background-color: rgba(255, 255, 255, 0.15);
        color: white;
        border: none;
        border-radius: var(--radius-sm);
        padding: 8px 16px;
        outline: none;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .theme-select:hover {
        background-color: rgba(255, 255, 255, 0.25);
      }

      .theme-toggle {
        background: transparent;
        border: none;
        color: white;
        cursor: pointer;
        font-size: 18px;
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: all 0.2s ease;
      }

      .theme-toggle:hover {
        background-color: rgba(255, 255, 255, 0.15);
      }

      .sidebar {
        background: linear-gradient(180deg, var(--primary-dark), #2d4569);
        color: var(--text-light);
        width: var(--sidebar-width);
        position: fixed;
        top: var(--header-height);
        left: 0;
        bottom: 0;
        padding: 25px 0;
        overflow-y: auto;
        box-shadow: inset -1px 0 0 rgba(0, 0, 0, 0.1);
      }

      .sidebar-title {
        padding: 10px 25px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: rgba(255, 255, 255, 0.85);
        margin-bottom: 5px;
      }

      .sidebar-menu {
        list-style: none;
        margin-top: 5px;
      }

      .sidebar-item {
        padding: 12px 25px;
        cursor: pointer;
        display: flex;
        align-items: center;
        transition: all 0.2s ease;
        font-size: 15px;
        border-left: 3px solid transparent;
      }

      .sidebar-item:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }

      .sidebar-item.active {
        background-color: rgba(255, 255, 255, 0.15);
        border-left: 3px solid var(--accent);
      }

      .sidebar-item-icon {
        margin-right: 12px;
        font-size: 12px;
        color: var(--accent);
      }

      .main-content {
        margin-left: var(--sidebar-width);
        margin-top: var(--header-height);
        padding: 35px;
        min-height: calc(100vh - var(--header-height));
      }

      .section-title {
        font-size: 30px;
        font-weight: 700;
        margin-bottom: 25px;
        color: var(--primary-dark);
        letter-spacing: -0.5px;
      }

      .category-title {
        font-size: 22px;
        font-weight: 600;
        margin: 35px 0 18px 0;
        color: var(--primary);
        display: flex;
        align-items: center;
      }

      .category-title:before {
        content: '';
        display: inline-block;
        width: 18px;
        height: 3px;
        background-color: var(--accent);
        margin-right: 12px;
        border-radius: 3px;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 24px;
        margin-bottom: 40px;
      }

      .card {
        background-color: var(--card-bg);
        border-radius: var(--radius-md);
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 20px;
        transition: all 0.25s ease;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        border: 1px solid rgba(0, 0, 0, 0.04);
        box-shadow: var(--shadow-sm);
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-md);
        background-color: white;
        border-color: rgba(99, 192, 245, 0.2);
      }

      .card-icon {
        width: 60px;
        height: 60px;
        border-radius: var(--radius-sm);
        overflow: hidden;
        background-color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(0, 0, 0, 0.04);
      }

      .card-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-content {
        flex: 1;
      }

      .card-title {
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 17px;
        color: var(--text-dark);
      }

      .card-description {
        font-size: 14px;
        color: rgba(51, 65, 85, 0.8);
      }

      @media (min-width: 1240px) {
        .card-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (max-width: 768px) {
        .sidebar {
          width: 0;
          overflow: hidden;
        }

        .main-content {
          margin-left: 0;
          padding: 25px;
        }

        .card-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

    <script type="module">
      import {
        h,
        render,
        Component,
        Fragment
      } from 'https://esm.sh/preact@10.13.1'
      import { useState } from 'https://esm.sh/preact@10.13.1/hooks'
      import htm from 'https://esm.sh/htm@3.1.1'
      // Import SweetAlert and secp256k1 libraries
      import Swal from 'https://cdn.jsdelivr.net/npm/sweetalert2@11/+esm'
      import * as secp256k1 from 'https://cdn.jsdelivr.net/npm/@noble/secp256k1@1.7.1/+esm'
      // Import Navbar component
      import Navbar from './navbar.js'

      // Make secp256k1 globally available
      window.secp256k1 = secp256k1

      // Initialize htm with Preact
      const html = htm.bind(h)

      // Load data from the data island
      const loadAppData = () => {
        try {
          const dataElement = document.getElementById('app-data')
          if (!dataElement) {
            console.error('App data element not found')
            return { sidebarItems: [], categories: [] }
          }
          const appData = JSON.parse(dataElement.textContent).appData
          return appData || { sidebarItems: [], categories: [] }
        } catch (error) {
          console.error('Error loading app data:', error)
          return { sidebarItems: [], categories: [] }
        }
      }

      // Get app data from the data island
      const appData = loadAppData()
      const { sidebarItems, categories } = appData

      // Sidebar component
      const Sidebar = ({ items }) => {
        return html`
          <div class="sidebar">
            <div class="sidebar-title">App Categories</div>
            <ul class="sidebar-menu">
              ${items.map(
                item => html`
                  <li class="sidebar-item ${item.active ? 'active' : ''}">
                    <span class="sidebar-item-icon">${item.icon}</span>
                    ${item.name}
                  </li>
                `
              )}
            </ul>
          </div>
        `
      }

      // Card component
      const Card = ({ app }) => {
        return html`
          <a href=${app.url} class="card">
            <div class="card-icon">
              <img src=${app.icon} alt=${app.name} />
            </div>
            <div class="card-content">
              <div class="card-title">${app.name}</div>
              ${app.description &&
              html`<div class="card-description">${app.description}</div>`}
            </div>
          </a>
        `
      }

      // Main content component
      const MainContent = ({ apps }) => {
        return html`
          <div class="main-content">
            <h1 class="section-title">App Directory</h1>

            ${apps.map(
              category => html`
                <h2 class="category-title">${category.name}</h2>
                <div class="card-grid">
                  ${category.items.map(app => html`<${Card} app=${app} />`)}
                </div>
              `
            )}
          </div>
        `
      }

      class App extends Component {
        constructor() {
          super()
          this.state = {
            user: null,
            sidebarItems,
            categories,
            pubkey: localStorage.getItem('pubkey') || null,
            privkey: localStorage.getItem('nostr:privkey') || null
          }
        }

        componentDidMount() {
          // Check if user is logged in via Nostr
          this.checkNostrLogin()

          // Check for private key in URL hash
          const hash = window.location.hash.substring(1) // Remove the # character
          if (hash && hash.length === 64 && /^[0-9a-fA-F]+$/.test(hash)) {
            // Valid private key in hash, use it to login
            this.loginWithPrivkey(hash)

            // Clean URL by removing the hash to protect privacy
            window.history.replaceState(
              null,
              null,
              window.location.pathname + window.location.search
            )
          }

          // Parse JSON data from URI query parameter
          this.parseUriQueryParam()
        }

        parseUriQueryParam() {
          const urlParams = new URLSearchParams(window.location.search)
          const uriParam = urlParams.get('uri')

          if (uriParam) {
            try {
              // Check if the URI parameter is a URL (starts with @ or http)
              if (uriParam.startsWith('@') || uriParam.startsWith('http')) {
                console.log('URL data from URI parameter:', uriParam)
                // Handle the URL string - fetch JSON data from the URL
                this.fetchJsonFromUrl(
                  uriParam.startsWith('@') ? uriParam.substring(1) : uriParam
                )
                // Don't clear the URI yet - will be done after fetch completes
              } else {
                // Try to decode URI component and parse as JSON
                const jsonData = JSON.parse(decodeURIComponent(uriParam))
                console.log('JSON data from URI parameter:', jsonData)
                // Handle the JSON data
                this.handleUriData(jsonData)

                // Clear the URI parameter after processing inline JSON
                window.history.replaceState(
                  null,
                  null,
                  window.location.pathname
                )
              }
            } catch (error) {
              console.error('Error parsing URI parameter:', error)
              // Optionally show user-friendly error message
            }
          }
        }

        fetchJsonFromUrl(url) {
          console.log('Fetching JSON data from URL:', url)

          // Determine if we need to use a CORS proxy for cross-origin requests
          const isExternalUrl =
            !url.startsWith(window.location.origin) &&
            !url.startsWith('/') &&
            !url.startsWith('.')

          // Use a CORS proxy for external URLs to avoid CORS issues
          const fetchUrl = isExternalUrl
            ? `https://cors-anywhere.herokuapp.com/${url}`
            : url

          // Alternative proxies if the above doesn't work:
          // - `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
          // - `https://corsproxy.io/?${encodeURIComponent(url)}`

          console.log('Fetching from URL (with CORS handling):', fetchUrl)

          fetch(fetchUrl, {
            headers: {
              Accept: 'application/json',
              // Add the following header if using cors-anywhere
              ...(isExternalUrl ? { 'X-Requested-With': 'XMLHttpRequest' } : {})
            }
          })
            .then(response => {
              if (!response.ok) {
                throw new Error(
                  `Network response was not ok: ${response.status}`
                )
              }
              return response.json()
            })
            .then(jsonData => {
              console.log('JSON data fetched from URL:', jsonData)
              this.handleUriData(jsonData)

              // Now clear the URI parameter after fetch is complete and data is processed
              window.history.replaceState(null, null, window.location.pathname)
            })
            .catch(error => {
              console.error('Error fetching JSON from URL:', error)

              // If first proxy fails, try an alternative
              if (isExternalUrl && fetchUrl.includes('cors-anywhere')) {
                console.log('Trying alternative CORS proxy...')
                const altProxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(
                  url
                )}`

                fetch(altProxyUrl)
                  .then(response => response.json())
                  .then(jsonData => {
                    console.log(
                      'JSON data fetched from alternative proxy:',
                      jsonData
                    )
                    this.handleUriData(jsonData)
                    window.history.replaceState(
                      null,
                      null,
                      window.location.pathname
                    )
                  })
                  .catch(altError => {
                    console.error('Error with alternative proxy:', altError)
                    window.history.replaceState(
                      null,
                      null,
                      window.location.pathname
                    )
                  })
              } else {
                // Still clear the URI parameter even if there's an error
                window.history.replaceState(
                  null,
                  null,
                  window.location.pathname
                )
              }
            })
        }

        handleUriData(data) {
          console.log('Handling URI data:', data)

          // Check if the data contains appData structure
          if (data.appData) {
            console.log('Found appData in URI data, updating app state')
            // Update the entire app data state with the fetched data
            this.setState(
              {
                categories: data.appData.categories || this.state.categories,
                sidebarItems:
                  data.appData.sidebarItems || this.state.sidebarItems
              },
              () => {
                console.log(
                  'App state updated with new data',
                  this.state.categories
                )
              }
            )
          }

          // Process the JSON data based on your application needs
          // For example, if it contains app information, navigate to that app
          if (data.appId) {
            const appUrl = this.findAppUrlById(data.appId)
            if (appUrl) {
              window.location.href = appUrl
            }
          }

          // Or if it contains user data, update user state
          if (data.userData) {
            this.setState({ userData: data.userData })
          }
        }

        findAppUrlById(appId) {
          // Search through categories and return URL for matching app ID
          for (const category of this.state.categories) {
            for (const app of category.items) {
              if (app.id === appId) {
                return app.url
              }
            }
          }
          return null
        }

        checkNostrLogin() {
          // Check if user is already logged in
          if (
            localStorage.getItem('loggedIn') === 'true' &&
            localStorage.getItem('pubkey')
          ) {
            const pubkey = localStorage.getItem('pubkey')
            this.setState({ user: { pubkey } })
          }
        }

        handleLogin = async pubkey => {
          // Update state when Navbar triggers login
          this.setState({ user: { pubkey } })
        }

        handleLogout = () => {
          // Update state when Navbar triggers logout
          this.setState({ user: null, privkey: null })
        }

        render() {
          const { user, sidebarItems, categories } = this.state

          return html`
            <div>
              <${Navbar}
                onLogin=${this.handleLogin}
                onLogout=${this.handleLogout}
              />
              <${Sidebar} items=${sidebarItems} />
              <${MainContent} apps=${categories} />
            </div>
          `
        }
      }

      render(html`<${App} />`, document.getElementById('app'))
    </script>
  </body>
</html>
