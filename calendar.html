<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calendar App</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <!-- Preact UMD build (to match todo.html approach) -->
    <script src="https://unpkg.com/preact@10.13.1/dist/preact.min.js"></script>
    <script src="https://unpkg.com/preact@10.13.1/hooks/dist/hooks.umd.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>

    <!-- Custom Tailwind Config -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e'
              },
              secondary: {
                50: '#fdf2f8',
                100: '#fce7f3',
                200: '#fbcfe8',
                300: '#f9a8d4',
                400: '#f472b6',
                500: '#ec4899',
                600: '#db2777',
                700: '#be185d',
                800: '#9d174d',
                900: '#831843'
              },
              neutral: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                800: '#1e293b',
                900: '#0f172a'
              }
            }
          }
        }
      }
    </script>

    <style>
      .fc-event {
        cursor: pointer;
        border-radius: 4px;
        padding: 2px 4px;
      }

      .fc-day-today {
        background-color: rgba(14, 165, 233, 0.05) !important;
      }

      .fc-button-primary {
        background-color: rgb(14, 165, 233) !important;
        border-color: rgb(14, 165, 233) !important;
      }

      .fc-button-primary:hover {
        background-color: rgb(2, 132, 199) !important;
        border-color: rgb(2, 132, 199) !important;
      }

      .fc-button-active {
        background-color: rgb(3, 105, 161) !important;
        border-color: rgb(3, 105, 161) !important;
      }

      .dark .fc-day {
        background-color: rgb(30, 41, 59) !important;
      }

      .dark .fc-day-today {
        background-color: rgba(14, 165, 233, 0.1) !important;
      }

      .dark .fc-scrollgrid-section-header th {
        background-color: rgb(30, 41, 59) !important;
        border-color: rgb(51, 65, 85) !important;
        color: white !important;
      }

      .dark .fc-col-header-cell-cushion {
        color: white !important;
      }

      .dark .fc-daygrid-day-number {
        color: white !important;
      }

      .dark .fc-timegrid-slot-label-cushion {
        color: white !important;
      }

      .dark .fc-list-day-cushion {
        background-color: rgb(30, 41, 59) !important;
        color: white !important;
      }
    </style>
  </head>
  <body
    class="bg-neutral-50 dark:bg-neutral-900 dark:text-white transition-colors duration-200 flex flex-col min-h-screen"
  >
    <!-- Navbar will be rendered here -->
    <div id="navbar"></div>

    <!-- Main app content -->
    <div id="app" class="flex-grow"></div>

    <script type="module">
      import Navbar from './navbar.js'
      import './nosdav-shim.js'
      import * as secp256k1 from 'https://cdn.jsdelivr.net/npm/@noble/secp256k1@1.7.1/+esm'
      import Swal from 'https://cdn.jsdelivr.net/npm/sweetalert2@11/+esm'

      // Make secp256k1 available globally (navbar.js expects this)
      window.secp256k1 = secp256k1

      // Initialize HTM with Preact (use globals from UMD build)
      const html = htm.bind(preact.h)

      // Use the preactHooks global from the UMD build
      const { useState, useEffect, useRef } = preactHooks

      // Initialize the navbar
      const navbarContainer = document.getElementById('navbar')
      if (navbarContainer) {
        preact.render(html`<${Navbar} />`, navbarContainer)
      }

      // Sample event categories
      const EVENT_CATEGORIES = [
        { id: 'work', name: 'Work', color: '#0ea5e9' },
        { id: 'personal', name: 'Personal', color: '#ec4899' },
        { id: 'family', name: 'Family', color: '#10b981' },
        { id: 'health', name: 'Health', color: '#f59e0b' },
        { id: 'other', name: 'Other', color: '#8b5cf6' }
      ]

      // Sample initial events (will be replaced by loaded events if available)
      const INITIAL_EVENTS = [
        {
          id: '1',
          title: 'Team Meeting',
          start: new Date(new Date().setHours(10, 0, 0, 0)),
          end: new Date(new Date().setHours(11, 30, 0, 0)),
          category: 'work',
          description: 'Weekly team sync meeting'
        },
        {
          id: '2',
          title: 'Lunch with Sarah',
          start: new Date(new Date().setHours(12, 30, 0, 0)),
          end: new Date(new Date().setHours(13, 30, 0, 0)),
          category: 'personal',
          description: 'Catch up over lunch'
        },
        {
          id: '3',
          title: 'Doctor Appointment',
          start: new Date(
            new Date().setDate(new Date().getDate() + 2)
          ).setHours(15, 0, 0, 0),
          end: new Date(new Date().setDate(new Date().getDate() + 2)).setHours(
            16,
            0,
            0,
            0
          ),
          category: 'health',
          description: 'Annual checkup'
        }
      ]

      // Storage related functions
      const getStorageProvider = () => {
        // Use nosdav.net as the primary storage solution
        return {
          save: async events => {
            try {
              const pubkey = localStorage.getItem('pubkey')
              if (!pubkey) {
                console.error('No pubkey found for nosdav storage')
                return false
              }

              const url = `https://nosdav.net/${pubkey}/public/calendar/calendar.json`
              const response = await fetch(url, {
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(events)
              })

              if (!response.ok) throw new Error('Network response was not ok')
              console.log('Calendar events saved to nosdav successfully')
              return true
            } catch (e) {
              console.error('Error saving to nosdav:', e)
              // Fall back to localStorage if nosdav fails
              if (typeof localStorage !== 'undefined') {
                try {
                  localStorage.setItem(
                    'calendar_events',
                    JSON.stringify(events)
                  )
                  console.log(
                    'Calendar events saved to localStorage as fallback'
                  )
                  return true
                } catch (localErr) {
                  console.error('Error saving to localStorage:', localErr)
                }
              }
              return false
            }
          },
          load: async () => {
            try {
              const pubkey = localStorage.getItem('pubkey')
              if (!pubkey) {
                console.error('No pubkey found for nosdav storage')
                return null
              }

              const url = `https://nosdav.net/${pubkey}/public/calendar/calendar.json`
              const response = await fetch(url)

              if (response.status === 404) {
                return null
              }

              if (!response.ok) throw new Error('Network response was not ok')
              const events = await response.json()

              // Convert string dates back to Date objects
              return events.map(event => ({
                ...event,
                start: new Date(event.start),
                end: new Date(event.end)
              }))
            } catch (e) {
              console.error('Error loading from nosdav:', e)
              // Try to load from localStorage if nosdav fails
              if (typeof localStorage !== 'undefined') {
                try {
                  const data = localStorage.getItem('calendar_events')
                  if (data) {
                    console.log('Loaded events from localStorage as fallback')
                    const events = JSON.parse(data)
                    // Convert string dates back to Date objects
                    return events.map(event => ({
                      ...event,
                      start: new Date(event.start),
                      end: new Date(event.end)
                    }))
                  }
                } catch (localErr) {
                  console.error('Error loading from localStorage:', localErr)
                }
              }
              return null
            }
          }
        }
      }

      const openStorageFile = () => {
        const pubkey = localStorage.getItem('pubkey')
        if (pubkey) {
          const url = `https://nosdav.net/${pubkey}/public/calendar/calendar.json`
          window.open(url, '_blank')
        } else {
          Swal.fire({
            title: 'Not Logged In',
            text: 'You need to login with Nostr to access your calendar storage.',
            icon: 'warning',
            confirmButtonText: 'OK'
          })
        }
      }

      // Modal Component
      const Modal = ({ isOpen, onClose, title, children }) => {
        if (!isOpen) return null

        return html`
          <div
            class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
          >
            <div
              class="bg-white dark:bg-neutral-800 rounded-lg shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto"
            >
              <div
                class="flex justify-between items-center p-4 border-b dark:border-neutral-700"
              >
                <h3 class="text-lg font-semibold">${title}</h3>
                <button
                  onClick=${onClose}
                  class="text-neutral-500 hover:text-neutral-700 dark:text-neutral-400 dark:hover:text-neutral-200"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-6 w-6"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M6 18L18 6M6 6l12 12"
                    />
                  </svg>
                </button>
              </div>
              <div class="p-4">${children}</div>
            </div>
          </div>
        `
      }

      // Calendar App Component
      const CalendarApp = () => {
        const [events, setEvents] = useState([])
        const [currentView, setCurrentView] = useState('dayGridMonth')
        const [isModalOpen, setIsModalOpen] = useState(false)
        const [isDeleteModalOpen, setIsDeleteModalOpen] = useState(false)
        const [currentEvent, setCurrentEvent] = useState(null)
        const [isDarkMode, setIsDarkMode] = useState(false)
        const [isLoading, setIsLoading] = useState(true)
        const [saveStatus, setSaveStatus] = useState(null)
        const calendarRef = useRef(null)

        // Form state
        const [formData, setFormData] = useState({
          id: '',
          title: '',
          start: '',
          end: '',
          category: 'work',
          description: ''
        })

        // Load events on component mount
        useEffect(() => {
          const loadEvents = async () => {
            setIsLoading(true)
            const storage = getStorageProvider()
            const loadedEvents = await storage.load()

            if (loadedEvents && loadedEvents.length > 0) {
              setEvents(loadedEvents)
              console.log('Loaded events from storage:', loadedEvents.length)
            } else {
              setEvents(INITIAL_EVENTS)
              console.log('Using default events')
            }

            setIsLoading(false)
          }

          loadEvents()
        }, [])

        // Save events whenever they change
        useEffect(() => {
          if (isLoading) return // Skip initial load

          const saveEvents = async () => {
            setSaveStatus('saving')
            const storage = getStorageProvider()
            const success = await storage.save(events)

            setSaveStatus(success ? 'saved' : 'error')
            setTimeout(() => setSaveStatus(null), 2000) // Clear status after 2 seconds
          }

          saveEvents()
        }, [events])

        // Initialize calendar
        useEffect(() => {
          const calendarEl = calendarRef.current
          if (!calendarEl) return

          const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: currentView,
            headerToolbar: {
              left: 'prev,next today',
              center: 'title',
              right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
            },
            events: events.map(event => ({
              ...event,
              color: EVENT_CATEGORIES.find(cat => cat.id === event.category)
                ?.color
            })),
            editable: true,
            selectable: true,
            selectMirror: true,
            dayMaxEvents: true,
            weekNumbers: true,
            navLinks: true,
            nowIndicator: true,
            dayHeaders: true,
            businessHours: {
              daysOfWeek: [1, 2, 3, 4, 5],
              startTime: '09:00',
              endTime: '17:00'
            },
            select: function (info) {
              const newEvent = {
                id: Date.now().toString(),
                title: '',
                start: info.start,
                end: info.end,
                category: 'work',
                description: ''
              }
              setCurrentEvent(newEvent)
              setFormData({
                id: newEvent.id,
                title: '',
                start: formatDateTimeForInput(info.start),
                end: formatDateTimeForInput(info.end),
                category: 'work',
                description: ''
              })
              setIsModalOpen(true)
            },
            eventClick: function (info) {
              const clickedEvent = events.find(e => e.id === info.event.id)
              if (clickedEvent) {
                setCurrentEvent(clickedEvent)
                setFormData({
                  id: clickedEvent.id,
                  title: clickedEvent.title,
                  start: formatDateTimeForInput(new Date(clickedEvent.start)),
                  end: formatDateTimeForInput(new Date(clickedEvent.end)),
                  category: clickedEvent.category,
                  description: clickedEvent.description || ''
                })
                setIsModalOpen(true)
              }
            },
            eventDrop: function (info) {
              updateEventTimes(info.event.id, info.event.start, info.event.end)
            },
            eventResize: function (info) {
              updateEventTimes(info.event.id, info.event.start, info.event.end)
            },
            viewDidMount: function (info) {
              setCurrentView(info.view.type)
            }
          })

          calendar.render()

          return () => {
            calendar.destroy()
          }
        }, [events, currentView])

        // Toggle dark mode
        useEffect(() => {
          if (isDarkMode) {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.remove('dark')
          }
        }, [isDarkMode])

        // Helper function to format date for input
        const formatDateTimeForInput = date => {
          const d = new Date(date)
          const year = d.getFullYear()
          const month = String(d.getMonth() + 1).padStart(2, '0')
          const day = String(d.getDate()).padStart(2, '0')
          const hours = String(d.getHours()).padStart(2, '0')
          const minutes = String(d.getMinutes()).padStart(2, '0')

          return `${year}-${month}-${day}T${hours}:${minutes}`
        }

        // Update event times after drag or resize
        const updateEventTimes = (id, start, end) => {
          setEvents(prevEvents =>
            prevEvents.map(event =>
              event.id === id ? { ...event, start, end } : event
            )
          )
        }

        // Handle form input changes
        const handleInputChange = e => {
          const { name, value } = e.target
          setFormData(prev => ({ ...prev, [name]: value }))
        }

        // Handle form submission
        const handleSubmit = e => {
          e.preventDefault()

          const updatedEvent = {
            id: formData.id,
            title: formData.title,
            start: new Date(formData.start),
            end: new Date(formData.end),
            category: formData.category,
            description: formData.description
          }

          if (events.some(e => e.id === updatedEvent.id)) {
            // Update existing event
            setEvents(prevEvents =>
              prevEvents.map(event =>
                event.id === updatedEvent.id ? updatedEvent : event
              )
            )
          } else {
            // Add new event
            setEvents(prevEvents => [...prevEvents, updatedEvent])
          }

          setIsModalOpen(false)
        }

        // Handle event deletion
        const handleDeleteEvent = () => {
          if (currentEvent) {
            setEvents(prevEvents =>
              prevEvents.filter(event => event.id !== currentEvent.id)
            )
            setIsDeleteModalOpen(false)
            setIsModalOpen(false)
          }
        }

        return html`
        <div class="min-h-full flex flex-col">
          <!-- Header -->
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 w-full">
            <div class="flex justify-between items-center">
              <div class="flex items-center">
                <h1 class="text-2xl font-bold text-primary-600 dark:text-primary-400">Calendar</h1>
                ${
                  saveStatus &&
                  html`
                    <span
                      class="ml-3 px-2 py-1 text-xs rounded-full ${saveStatus ===
                      'saving'
                        ? 'bg-yellow-100 text-yellow-800'
                        : saveStatus === 'saved'
                        ? 'bg-green-100 text-green-800'
                        : 'bg-red-100 text-red-800'}"
                    >
                      ${saveStatus === 'saving'
                        ? 'Saving...'
                        : saveStatus === 'saved'
                        ? 'Saved'
                        : 'Error saving'}
                    </span>
                  `
                }
                
                <button
                  onClick=${openStorageFile}
                  class="ml-3 text-xs text-primary-500 hover:text-primary-700 flex items-center"
                  title="View data file"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                  </svg>
                  View Data
                </button>
              </div>
              <div class="flex items-center space-x-4">
                <button 
                  onClick=${() => setIsDarkMode(prev => !prev)}
                  class="p-2 rounded-full bg-neutral-100 dark:bg-neutral-700 text-neutral-700 dark:text-neutral-200"
                  aria-label="Toggle dark mode"
                >
                  ${
                    isDarkMode
                      ? html`
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-5 w-5"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                          >
                            <path
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
                            />
                          </svg>
                        `
                      : html`
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-5 w-5"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                          >
                            <path
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                            />
                          </svg>
                        `
                  }
                </button>
                <button 
                  onClick=${() => {
                    setCurrentEvent(null)
                    setFormData({
                      id: Date.now().toString(),
                      title: '',
                      start: formatDateTimeForInput(new Date()),
                      end: formatDateTimeForInput(
                        new Date(new Date().getTime() + 60 * 60 * 1000)
                      ),
                      category: 'work',
                      description: ''
                    })
                    setIsModalOpen(true)
                  }}
                  class="px-4 py-2 bg-primary-500 hover:bg-primary-600 text-white rounded-md shadow-sm transition-colors"
                >
                  Add Event
                </button>
              </div>
            </div>
          </div>
          
          <!-- Main Content -->
          <main class="flex-grow p-4 sm:p-6 lg:p-8">
            <div class="max-w-7xl mx-auto bg-white dark:bg-neutral-800 rounded-lg shadow-md p-4 sm:p-6">
              ${
                isLoading
                  ? html`<div class="flex justify-center items-center h-64">
                      <div
                        class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary-500"
                      ></div>
                    </div>`
                  : html`<div
                      class="calendar-container"
                      ref=${calendarRef}
                    ></div>`
              }
            </div>
          </main>
          
          <!-- Event Modal -->
          <${Modal} 
            isOpen=${isModalOpen} 
            onClose=${() => setIsModalOpen(false)} 
            title=${
              currentEvent && currentEvent.title
                ? `Edit: ${currentEvent.title}`
                : 'Add New Event'
            }
          >
            <form onSubmit=${handleSubmit} class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">
                  Event Title
                </label>
                <input 
                  type="text" 
                  name="title" 
                  value=${formData.title} 
                  onChange=${handleInputChange}
                  required
                  class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-600 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 dark:bg-neutral-700 dark:text-white"
                  placeholder="Enter event title"
                />
              </div>
              
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">
                    Start Date & Time
                  </label>
                  <input 
                    type="datetime-local" 
                    name="start" 
                    value=${formData.start} 
                    onChange=${handleInputChange}
                    required
                    class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-600 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 dark:bg-neutral-700 dark:text-white"
                  />
                </div>
                
                <div>
                  <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">
                    End Date & Time
                  </label>
                  <input 
                    type="datetime-local" 
                    name="end" 
                    value=${formData.end} 
                    onChange=${handleInputChange}
                    required
                    class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-600 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 dark:bg-neutral-700 dark:text-white"
                  />
                </div>
              </div>
              
              <div>
                <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">
                  Category
                </label>
                <select 
                  name="category" 
                  value=${formData.category} 
                  onChange=${handleInputChange}
                  class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-600 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 dark:bg-neutral-700 dark:text-white"
                >
                  ${EVENT_CATEGORIES.map(
                    category => html`
                      <option value=${category.id} key=${category.id}>
                        ${category.name}
                      </option>
                    `
                  )}
                </select>
              </div>
              
              <div>
                <label class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1">
                  Description
                </label>
                <textarea 
                  name="description" 
                  value=${formData.description} 
                  onChange=${handleInputChange}
                  rows="3"
                  class="w-full px-3 py-2 border border-neutral-300 dark:border-neutral-600 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 dark:bg-neutral-700 dark:text-white"
                  placeholder="Add event details (optional)"
                ></textarea>
              </div>
              
              <div class="flex justify-between pt-2">
                <div>
                  ${
                    currentEvent && currentEvent.title
                      ? html`
                          <button
                            type="button"
                            onClick=${() => setIsDeleteModalOpen(true)}
                            class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-md shadow-sm transition-colors"
                          >
                            Delete
                          </button>
                        `
                      : null
                  }
                </div>
                
                <div class="flex space-x-3">
                  <button 
                    type="button"
                    onClick=${() => setIsModalOpen(false)}
                    class="px-4 py-2 bg-neutral-200 hover:bg-neutral-300 dark:bg-neutral-700 dark:hover:bg-neutral-600 text-neutral-800 dark:text-neutral-200 rounded-md shadow-sm transition-colors"
                  >
                    Cancel
                  </button>
                  
                  <button 
                    type="submit"
                    class="px-4 py-2 bg-primary-500 hover:bg-primary-600 text-white rounded-md shadow-sm transition-colors"
                  >
                    ${currentEvent && currentEvent.title ? 'Update' : 'Create'}
                  </button>
                </div>
              </div>
            </form>
          </${Modal}>
          
          <!-- Delete Confirmation Modal -->
          <${Modal} 
            isOpen=${isDeleteModalOpen} 
            onClose=${() => setIsDeleteModalOpen(false)} 
            title="Confirm Deletion"
          >
            <div class="space-y-4">
              <p class="text-neutral-700 dark:text-neutral-300">
                Are you sure you want to delete this event? This action cannot be undone.
              </p>
              
              <div class="flex justify-end space-x-3 pt-2">
                <button 
                  onClick=${() => setIsDeleteModalOpen(false)}
                  class="px-4 py-2 bg-neutral-200 hover:bg-neutral-300 dark:bg-neutral-700 dark:hover:bg-neutral-600 text-neutral-800 dark:text-neutral-200 rounded-md shadow-sm transition-colors"
                >
                  Cancel
                </button>
                
                <button 
                  onClick=${handleDeleteEvent}
                  class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-md shadow-sm transition-colors"
                >
                  Delete
                </button>
              </div>
            </div>
          </${Modal}>
          
          <!-- Footer -->
          <footer class="bg-white dark:bg-neutral-800 shadow-sm mt-auto">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
              <div class="flex flex-col sm:flex-row justify-between items-center">
                <p class="text-sm text-neutral-500 dark:text-neutral-400">
                  Modern Calendar App
                </p>
                
                <div class="flex mt-2 sm:mt-0">
                  <div class="flex flex-wrap justify-center gap-2">
                    ${EVENT_CATEGORIES.map(
                      category => html`
                        <div class="flex items-center" key=${category.id}>
                          <span
                            class="inline-block w-3 h-3 rounded-full mr-1"
                            style=${{ backgroundColor: category.color }}
                          ></span>
                          <span
                            class="text-xs text-neutral-600 dark:text-neutral-400"
                            >${category.name}</span
                          >
                        </div>
                      `
                    )}
                  </div>
                </div>
              </div>
            </div>
          </footer>
        </div>
      `
      }

      // Render the app
      preact.render(html`<${CalendarApp} />`, document.getElementById('app'))
    </script>
  </body>
</html>
