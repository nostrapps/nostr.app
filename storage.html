<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Identity Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif']
            },
            animation: {
              float: 'float 6s ease-in-out infinite',
              'pulse-glow': 'pulse-glow 3s ease-in-out infinite'
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-20px)' }
              },
              'pulse-glow': {
                '0%, 100%': {
                  boxShadow:
                    '0 8px 20px rgba(91, 33, 182, 0.3), 0 0 0 8px rgba(255, 255, 255, 0.7)'
                },
                '50%': {
                  boxShadow:
                    '0 8px 30px rgba(91, 33, 182, 0.5), 0 0 0 12px rgba(255, 255, 255, 0.8)'
                }
              }
            }
          }
        }
      }
    </script>

    <!-- Preact and HTM Scripts -->
    <script src="https://unpkg.com/preact@10.13.1/dist/preact.min.js"></script>
    <script src="https://unpkg.com/preact@10.13.1/hooks/dist/hooks.umd.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>

    <style>
      /* Custom background animation */
      .bg-animation {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1;
      }

      .bg-animation li {
        position: absolute;
        display: block;
        list-style: none;
        width: 20px;
        height: 20px;
        background: rgba(255, 255, 255, 0.1);
        animation: animate 25s linear infinite;
        bottom: -150px;
        border-radius: 50%;
      }

      .bg-animation li:nth-child(1) {
        left: 25%;
        width: 80px;
        height: 80px;
        animation-delay: 0s;
      }

      .bg-animation li:nth-child(2) {
        left: 10%;
        width: 20px;
        height: 20px;
        animation-delay: 2s;
        animation-duration: 12s;
      }

      .bg-animation li:nth-child(3) {
        left: 70%;
        width: 20px;
        height: 20px;
        animation-delay: 4s;
      }

      .bg-animation li:nth-child(4) {
        left: 40%;
        width: 60px;
        height: 60px;
        animation-delay: 0s;
        animation-duration: 18s;
      }

      .bg-animation li:nth-child(5) {
        left: 65%;
        width: 20px;
        height: 20px;
        animation-delay: 0s;
      }

      .bg-animation li:nth-child(6) {
        left: 75%;
        width: 110px;
        height: 110px;
        animation-delay: 3s;
      }

      .bg-animation li:nth-child(7) {
        left: 35%;
        width: 150px;
        height: 150px;
        animation-delay: 7s;
      }

      @keyframes animate {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0.5;
        }
        100% {
          transform: translateY(-1000px) rotate(720deg);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center p-4 font-sans"
  >
    <div id="app"></div>

    <!-- Background Animation -->
    <ul class="bg-animation">
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
    </ul>

    <script>
      // Configuration - Set default pubkey here
      const DEFAULT_PUBKEY =
        '8d2cf0ee39bd6a449efd7200a3f6ac310042058a182bd082c218f5ebe14d8dc2'

      // Initialize htm with Preact
      const html = htm.bind(preact.h)
      const { useState, useEffect } = preactHooks

      // SVG components
      const UserIcon = () => html`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          className="w-8 h-8 text-white"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      `

      const CopyIcon = () => html`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          className="w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path
            d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
          ></path>
        </svg>
      `

      const AppsIcon = () => html`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          className="w-6 h-6 text-violet-600"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
      `

      const ProfileIcon = () => html`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          className="w-6 h-6 text-violet-600"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      `

      const AgentIcon = () => html`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          className="w-6 h-6 text-violet-600"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect>
          <path d="M16 2v4"></path>
          <path d="M8 2v4"></path>
          <path d="M12 10v6"></path>
          <path d="M9 13h6"></path>
        </svg>
      `

      const ExternalLinkIcon = () => html`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          className="w-5 h-5 text-violet-300 group-hover:text-violet-500 transition-all duration-300 group-hover:translate-x-1 group-hover:-translate-y-1"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path
            d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
          ></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      `

      const MoonIcon = () => html`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          className="w-5 h-5 text-white"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      `

      const SunIcon = () => html`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          className="w-5 h-5 text-white"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      `

      const NostrIcon = () => html`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          className="w-4 h-4 inline mr-1"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M11.996 2.286c-4.764 0-8.622 3.859-8.622 8.622 0 4.764 3.858 8.627 8.622 8.627 4.763 0 8.626-3.862 8.626-8.627 0-4.763-3.862-8.622-8.626-8.622zm-1.604 3.967h3.208c2.571 0 4.658 2.089 4.658 4.66 0 2.57-2.087 4.657-4.658 4.657h-3.208c-2.571 0-4.659-2.087-4.659-4.658 0-2.57 2.088-4.659 4.659-4.659z"
          />
        </svg>
      `

      // Main App Component
      function App() {
        const [loading, setLoading] = useState(true)
        const [pubkey, setPubkey] = useState('')
        const [showCopyTooltip, setShowCopyTooltip] = useState(false)
        const [currentDate, setCurrentDate] = useState('')
        const [agentJsonExists, setAgentJsonExists] = useState(false)
        const [darkTheme, setDarkTheme] = useState(false)
        const [profileData, setProfileData] = useState(null)

        useEffect(() => {
          // Extract pubkey from URL
          const urlParams = new URLSearchParams(window.location.search)

          // Check for uri= parameter first (as requested)
          let key = urlParams.get('uri')

          // If uri not specified, try pubkey parameter
          if (!key) {
            key = urlParams.get('pubkey')
          }

          // If not found in query params, look for it in the path
          const pathParts = window.location.pathname.split('/')
          if (!key) {
            for (let part of pathParts) {
              if (part.length === 64 && /^[0-9a-f]{64}$/i.test(part)) {
                key = part
                break
              }
            }
          }

          // If still not found, check the hash
          if (!key && window.location.hash) {
            const hash = window.location.hash.substring(1)
            if (hash.length === 64 && /^[0-9a-f]{64}$/i.test(hash)) {
              key = hash
            }
          }

          // Use the configured default pubkey if none is found
          const finalPubkey = key || DEFAULT_PUBKEY
          setPubkey(finalPubkey)

          // Check if agent.json exists
          fetch('./.well-known/agent.json', { method: 'GET' })
            .then(response => {
              if (response.ok) {
                setAgentJsonExists(true)
              }
            })
            .catch(() => {
              // File doesn't exist or network error, keep agentJsonExists as false
            })

          // Fetch profile data
          fetch('./profile.json', { method: 'GET' })
            .then(response => {
              if (response.ok) {
                return response.json()
              }
              throw new Error('Profile not found')
            })
            .then(data => {
              setProfileData(data)
            })
            .catch(() => {
              // Profile doesn't exist or network error
            })

          // Set current date with time
          const now = new Date()
          setCurrentDate(
            now.toLocaleDateString() + ' ' + now.toLocaleTimeString()
          )

          // Check for stored theme preference
          const storedTheme = localStorage.getItem('nostr-theme')
          if (storedTheme === 'dark') {
            setDarkTheme(true)
            document.documentElement.classList.add('dark')
          }

          setLoading(false)
        }, [])

        const copyToClipboard = () => {
          navigator.clipboard.writeText(pubkey).then(() => {
            setShowCopyTooltip(true)
            setTimeout(() => setShowCopyTooltip(false), 2000)
          })
        }

        const toggleTheme = () => {
          const newTheme = !darkTheme
          setDarkTheme(newTheme)

          if (newTheme) {
            document.documentElement.classList.add('dark')
            localStorage.setItem('nostr-theme', 'dark')
          } else {
            document.documentElement.classList.remove('dark')
            localStorage.setItem('nostr-theme', 'light')
          }
        }

        if (loading) {
          return html`
            <div
              className="flex flex-col items-center justify-center min-h-screen text-white"
            >
              <div
                className="w-12 h-12 border-4 border-white/20 border-t-white rounded-full animate-spin mb-4"
              ></div>
              <span className="text-lg font-medium">Loading Identity...</span>
            </div>
          `
        }

        return html`
          <!-- Theme Toggle Button -->
          <button
            onClick=${toggleTheme}
            className="fixed top-4 right-4 z-10 p-2 bg-white/20 backdrop-blur-sm rounded-full hover:bg-white/30 transition-all duration-300 hover:rotate-12"
          >
            ${darkTheme ? html`<${SunIcon} />` : html`<${MoonIcon} />`}
          </button>

          <!-- Main Card -->
          <div
            className="relative w-full max-w-md bg-white/95 dark:bg-slate-800/95 backdrop-blur-xl rounded-3xl shadow-2xl p-10 transition-all duration-500 hover:shadow-3xl hover:-translate-y-2 animate-float"
          >
            <!-- Avatar Container -->
            <div
              className="absolute -top-14 left-1/2 transform -translate-x-1/2"
            >
              <div
                className="relative w-28 h-28 rounded-full bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center animate-pulse-glow overflow-hidden"
              >
                ${profileData && profileData.picture
                  ? html`<img
                      src="${profileData.picture}"
                      alt="Profile"
                      className="absolute inset-0 w-full h-full object-cover rounded-full"
                    />`
                  : html`<${UserIcon} />`}
              </div>
            </div>

            <!-- Content -->
            <div className="mt-16 text-center">
              <!-- Name and Subtitle -->
              <h1
                className="text-3xl font-bold bg-gradient-to-r from-violet-600 to-purple-600 bg-clip-text text-transparent mb-2"
              >
                ${profileData && profileData.name
                  ? profileData.name
                  : 'Agent Identity'}
              </h1>
              <p
                className="text-violet-600 dark:text-violet-400 mb-8 text-lg font-medium"
              >
                ${profileData && profileData.about
                  ? profileData.about
                  : 'Your decentralized digital presence'}
              </p>

              <!-- Public Key -->
              <div
                className="relative bg-gradient-to-br from-violet-50 to-purple-50 dark:from-slate-700 dark:to-slate-600 rounded-2xl p-5 mb-8 border border-violet-100 dark:border-slate-600 hover:shadow-md transition-all duration-300"
              >
                <p
                  className="font-mono text-sm text-violet-700 dark:text-violet-300 break-all text-left"
                >
                  did:nostr:${pubkey}
                </p>
                <button
                  onClick=${copyToClipboard}
                  className="absolute top-3 right-3 p-2 bg-violet-100 dark:bg-slate-600 hover:bg-violet-200 dark:hover:bg-slate-500 rounded-lg transition-all duration-200 hover:-translate-y-0.5 text-violet-600 dark:text-violet-300"
                >
                  <${CopyIcon} />
                </button>
                ${showCopyTooltip &&
                html`
                  <div
                    className="absolute -top-10 right-0 bg-violet-600 text-white text-xs px-3 py-1.5 rounded-lg animate-pulse"
                  >
                    Copied!
                  </div>
                `}
              </div>

              <!-- Links -->
              <div className="space-y-4 mb-8">
                <a
                  href=${`/${pubkey}/settings/publicTypeIndex.html`}
                  className="group flex items-center justify-between bg-gradient-to-r from-white to-gray-50 dark:from-slate-700 dark:to-slate-600 rounded-2xl p-5 border border-violet-100 dark:border-slate-600 hover:shadow-lg hover:-translate-y-1 transition-all duration-300"
                >
                  <div className="flex items-center">
                    <div
                      className="bg-violet-50 dark:bg-slate-600 p-3 rounded-xl mr-4 group-hover:rotate-6 transition-transform duration-300"
                    >
                      <${AppsIcon} />
                    </div>
                    <div className="text-left">
                      <h3
                        className="font-semibold text-violet-800 dark:text-violet-200 mb-1"
                      >
                        My Applications
                      </h3>
                      <p
                        className="text-sm text-violet-600 dark:text-violet-400"
                      >
                        Access your connected apps and services
                      </p>
                    </div>
                  </div>
                  <${ExternalLinkIcon} />
                </a>

                <a
                  href=${`https://nostr.social/profile/${pubkey}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="group flex items-center justify-between bg-gradient-to-r from-white to-gray-50 dark:from-slate-700 dark:to-slate-600 rounded-2xl p-5 border border-violet-100 dark:border-slate-600 hover:shadow-lg hover:-translate-y-1 transition-all duration-300"
                >
                  <div className="flex items-center">
                    <div
                      className="bg-violet-50 dark:bg-slate-600 p-3 rounded-xl mr-4 group-hover:rotate-6 transition-transform duration-300"
                    >
                      <${ProfileIcon} />
                    </div>
                    <div className="text-left">
                      <h3
                        className="font-semibold text-violet-800 dark:text-violet-200 mb-1"
                      >
                        Social Profile
                      </h3>
                      <p
                        className="text-sm text-violet-600 dark:text-violet-400"
                      >
                        View your Nostr social presence
                      </p>
                    </div>
                  </div>
                  <${ExternalLinkIcon} />
                </a>

                ${agentJsonExists &&
                html`
                  <a
                    href="./.well-known/"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="group flex items-center justify-between bg-gradient-to-r from-white to-gray-50 dark:from-slate-700 dark:to-slate-600 rounded-2xl p-5 border border-violet-100 dark:border-slate-600 hover:shadow-lg hover:-translate-y-1 transition-all duration-300"
                  >
                    <div className="flex items-center">
                      <div
                        className="bg-violet-50 dark:bg-slate-600 p-3 rounded-xl mr-4 group-hover:rotate-6 transition-transform duration-300"
                      >
                        <${AgentIcon} />
                      </div>
                      <div className="text-left">
                        <h3
                          className="font-semibold text-violet-800 dark:text-violet-200 mb-1"
                        >
                          Agent Information
                        </h3>
                        <p
                          className="text-sm text-violet-600 dark:text-violet-400"
                        >
                          View your agent's technical configuration
                        </p>
                      </div>
                    </div>
                    <${ExternalLinkIcon} />
                  </a>
                `}
              </div>

              <!-- Footer -->
              <div
                className="pt-6 border-t border-violet-100 dark:border-slate-600"
              >
                <p
                  className="text-sm text-violet-600 dark:text-violet-400 flex items-center justify-center"
                >
                  <${NostrIcon} />
                  Connected to the Nostr network • ${currentDate}
                </p>
              </div>
            </div>
          </div>
        `
      }

      // Render the app
      preact.render(html`<${App} />`, document.getElementById('app'))
    </script>
  </body>
</html>
