<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nostr Identity Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Reset and base styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue',
          sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #eff6ff, #dbeafe, #bfdbfe);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        color: #1e3a8a;
      }

      /* Card styles */
      .card {
        position: relative;
        width: 100%;
        max-width: 28rem;
        background-color: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 1rem;
        box-shadow: 0 10px 25px rgba(30, 58, 138, 0.1);
        padding: 2rem;
        transition: all 0.3s ease;
      }

      .card:hover {
        box-shadow: 0 15px 30px rgba(30, 58, 138, 0.15);
        transform: translateY(-5px);
      }

      /* Avatar styles */
      .avatar-container {
        position: absolute;
        top: -3rem;
        left: 50%;
        transform: translateX(-50%);
      }

      .avatar {
        width: 6rem;
        height: 6rem;
        border-radius: 50%;
        background: linear-gradient(135deg, #60a5fa, #3b82f6);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
      }

      /* Content styles */
      .content {
        margin-top: 3.5rem;
        text-align: center;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1e3a8a;
        margin-bottom: 0.5rem;
      }

      .subtitle {
        color: #3b82f6;
        margin-bottom: 1.5rem;
        font-size: 0.95rem;
      }

      /* Pubkey styles */
      .pubkey-container {
        background-color: #eff6ff;
        border-radius: 0.5rem;
        padding: 1rem;
        margin-bottom: 1.5rem;
        position: relative;
      }

      .pubkey {
        font-family: monospace;
        font-size: 0.75rem;
        color: #1e40af;
        word-break: break-all;
        text-align: left;
      }

      .copy-button {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        background: transparent;
        border: none;
        cursor: pointer;
        color: #3b82f6;
        padding: 0.25rem;
        border-radius: 0.25rem;
        transition: all 0.2s ease;
      }

      .copy-button:hover {
        background-color: #dbeafe;
        color: #1e40af;
      }

      .copy-tooltip {
        position: absolute;
        top: -2rem;
        right: 0;
        background-color: #1e3a8a;
        color: white;
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
        border-radius: 0.25rem;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }

      .copy-tooltip.visible {
        opacity: 1;
      }

      /* Link styles */
      .links {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .link-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: white;
        border-radius: 0.75rem;
        padding: 1rem;
        box-shadow: 0 2px 5px rgba(30, 58, 138, 0.05);
        border: 1px solid #eff6ff;
        text-decoration: none;
        transition: all 0.2s ease;
      }

      .link-card:hover {
        box-shadow: 0 4px 10px rgba(30, 58, 138, 0.1);
        border-color: #bfdbfe;
        transform: translateY(-2px);
      }

      .link-content {
        display: flex;
        align-items: center;
      }

      .link-icon-container {
        background-color: #eff6ff;
        padding: 0.5rem;
        border-radius: 0.5rem;
        margin-right: 0.75rem;
      }

      .link-icon {
        width: 1.25rem;
        height: 1.25rem;
        color: #3b82f6;
      }

      .link-text {
        text-align: left;
      }

      .link-title {
        font-weight: 500;
        color: #1e3a8a;
        margin-bottom: 0.25rem;
      }

      .link-description {
        font-size: 0.875rem;
        color: #3b82f6;
      }

      .external-icon {
        width: 1.25rem;
        height: 1.25rem;
        color: #93c5fd;
      }

      /* Footer styles */
      .footer {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid #eff6ff;
        text-align: center;
      }

      .footer-text {
        font-size: 0.75rem;
        color: #60a5fa;
      }

      /* Loading state */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #3b82f6;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* Responsive adjustments */
      @media (max-width: 640px) {
        .card {
          padding: 1.5rem;
        }

        h1 {
          font-size: 1.25rem;
        }

        .avatar {
          width: 5rem;
          height: 5rem;
        }
      }
    </style>

    <!-- Preact and HTM Scripts -->
    <script src="https://unpkg.com/preact@10.13.1/dist/preact.min.js"></script>
    <script src="https://unpkg.com/preact@10.13.1/hooks/dist/hooks.umd.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <script>
      // Initialize htm with Preact
      const html = htm.bind(preact.h)
      const { useState, useEffect } = preactHooks

      // SVG components
      const UserIcon = () => html`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      `

      const CopyIcon = () => html`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path
            d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
          ></path>
        </svg>
      `

      const AppsIcon = () => html`
        <svg
          class="link-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
      `

      const ProfileIcon = () => html`
        <svg
          class="link-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      `

      const AgentIcon = () => html`
        <svg
          class="link-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect>
          <path d="M16 2v4"></path>
          <path d="M8 2v4"></path>
          <path d="M12 10v6"></path>
          <path d="M9 13h6"></path>
        </svg>
      `

      const ExternalLinkIcon = () => html`
        <svg
          class="external-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
          ></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      `

      // Main App Component
      function App() {
        const [loading, setLoading] = useState(true)
        const [pubkey, setPubkey] = useState('')
        const [showCopyTooltip, setShowCopyTooltip] = useState(false)
        const [currentDate, setCurrentDate] = useState('')
        const [agentJsonExists, setAgentJsonExists] = useState(false)

        useEffect(() => {
          // Extract pubkey from URL
          const urlParams = new URLSearchParams(window.location.search)
          const pathParts = window.location.pathname.split('/')

          // Try different methods to find the pubkey
          let key = urlParams.get('pubkey') // Check for ?pubkey=

          // If not found in query params, look for it in the path
          if (!key) {
            for (let part of pathParts) {
              if (part.length === 64 && /^[0-9a-f]{64}$/i.test(part)) {
                key = part
                break
              }
            }
          }

          // If still not found, check the hash
          if (!key && window.location.hash) {
            const hash = window.location.hash.substring(1)
            if (hash.length === 64 && /^[0-9a-f]{64}$/i.test(hash)) {
              key = hash
            }
          }

          // Set a default pubkey for demo if none is found
          const finalPubkey =
            key ||
            '3bf0c63fcb93463407af97a5e5ee64fa883d107ef9e558472c4eb9aaaefa459d'
          setPubkey(finalPubkey)

          // Check if agent.json exists
          fetch('/.well-known/agent.json', { method: 'HEAD' })
            .then(response => {
              if (response.ok) {
                setAgentJsonExists(true)
              }
            })
            .catch(() => {
              // File doesn't exist or network error, keep agentJsonExists as false
            })

          setCurrentDate(new Date().toLocaleDateString())
          setLoading(false)
        }, [])

        const copyToClipboard = () => {
          navigator.clipboard.writeText(pubkey).then(() => {
            setShowCopyTooltip(true)
            setTimeout(() => setShowCopyTooltip(false), 2000)
          })
        }

        if (loading) {
          return html`<div class="loading">Loading...</div>`
        }

        return html`
          <div class="card">
            <div class="avatar-container">
              <div class="avatar">
                <${UserIcon} />
              </div>
            </div>

            <div class="content">
              <h1>Nostr Identity</h1>
              <p class="subtitle">Your decentralized digital presence</p>

              <div class="pubkey-container">
                <p class="pubkey">${pubkey}</p>
                <button onClick=${copyToClipboard} class="copy-button">
                  <${CopyIcon} />
                </button>
                <div
                  class=${`copy-tooltip ${showCopyTooltip ? 'visible' : ''}`}
                >
                  Copied!
                </div>
              </div>

              <div class="links">
                <a
                  href=${`/${pubkey}/settings/publicTypeIndex.html`}
                  class="link-card"
                >
                  <div class="link-content">
                    <div class="link-icon-container">
                      <${AppsIcon} />
                    </div>
                    <div class="link-text">
                      <h3 class="link-title">My Apps</h3>
                      <p class="link-description">Access your applications</p>
                    </div>
                  </div>
                  <${ExternalLinkIcon} />
                </a>

                <a
                  href=${`https://nostr.social/profile/${pubkey}`}
                  class="link-card"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  <div class="link-content">
                    <div class="link-icon-container">
                      <${ProfileIcon} />
                    </div>
                    <div class="link-text">
                      <h3 class="link-title">Nostr Profile</h3>
                      <p class="link-description">View your social profile</p>
                    </div>
                  </div>
                  <${ExternalLinkIcon} />
                </a>

                ${agentJsonExists
                  ? html`
                      <a
                        href="/.well-known/agent.json"
                        class="link-card"
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        <div class="link-content">
                          <div class="link-icon-container">
                            <${AgentIcon} />
                          </div>
                          <div class="link-text">
                            <h3 class="link-title">A2A Agent Info</h3>
                            <p class="link-description">
                              View agent configuration
                            </p>
                          </div>
                        </div>
                        <${ExternalLinkIcon} />
                      </a>
                    `
                  : ''}
              </div>

              <div class="footer">
                <p class="footer-text">
                  Connected to the Nostr network • ${currentDate}
                </p>
              </div>
            </div>
          </div>
        `
      }

      // Render the app
      preact.render(html`<${App} />`, document.getElementById('app'))
    </script>
  </body>
</html>
