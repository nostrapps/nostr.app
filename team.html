<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NosDAV - Our Team</title>
    <script
      type="module"
      src="https://unpkg.com/preact@10.19.3/dist/preact.module.js"
    ></script>
    <script
      type="module"
      src="https://unpkg.com/htm@3.1.1/dist/htm.module.js"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(
          135deg,
          #0a0a0a 0%,
          #1a1a2e 50%,
          #16213e 100%
        );
        color: #ffffff;
        overflow-x: hidden;
        min-height: 100vh;
      }

      .background-grid {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(
            rgba(59, 130, 246, 0.1) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px);
        background-size: 50px 50px;
        z-index: -1;
        animation: grid-move 20s linear infinite;
      }

      @keyframes grid-move {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(50px, 50px);
        }
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .hero {
        text-align: center;
        padding: 80px 0 60px;
        position: relative;
      }

      .hero::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          rgba(147, 51, 234, 0.3) 0%,
          transparent 70%
        );
        transform: translate(-50%, -50%);
        z-index: -1;
        animation: pulse-glow 3s ease-in-out infinite;
      }

      @keyframes pulse-glow {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.7;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.1);
          opacity: 1;
        }
      }

      .dao-logo {
        font-size: 3.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6, #06b6d4);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 20px;
        animation: fade-in-up 1s ease-out;
      }

      .hero-subtitle {
        font-size: 1.3rem;
        color: #94a3b8;
        margin-bottom: 40px;
        animation: fade-in-up 1s ease-out 0.2s both;
      }

      .team-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 30px;
        margin-top: 60px;
      }

      .team-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 30px;
        text-align: center;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        animation: fade-in-up 0.8s ease-out both;
      }

      .team-card:nth-child(1) {
        animation-delay: 0.1s;
      }
      .team-card:nth-child(2) {
        animation-delay: 0.2s;
      }
      .team-card:nth-child(3) {
        animation-delay: 0.3s;
      }
      .team-card:nth-child(4) {
        animation-delay: 0.4s;
      }
      .team-card:nth-child(5) {
        animation-delay: 0.5s;
      }
      .team-card:nth-child(6) {
        animation-delay: 0.6s;
      }

      .team-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6, #06b6d4);
        transform: scaleX(0);
        transition: transform 0.3s ease;
      }

      .team-card:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 20px 40px rgba(59, 130, 246, 0.3);
        border-color: rgba(59, 130, 246, 0.5);
      }

      .team-card:hover::before {
        transform: scaleX(1);
      }

      .avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: 600;
        color: white;
        position: relative;
        overflow: hidden;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
      }

      .avatar::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          45deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        transform: rotate(45deg);
        animation: shimmer 2s linear infinite;
        z-index: 1;
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%) translateY(-100%) rotate(45deg);
        }
        100% {
          transform: translateX(100%) translateY(100%) rotate(45deg);
        }
      }

      .member-name {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #ffffff, #94a3b8);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .member-role {
        color: #06b6d4;
        font-weight: 500;
        margin-bottom: 20px;
        font-family: 'JetBrains Mono', monospace;
      }

      .member-bio {
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 20px;
        font-size: 0.95rem;
      }

      .skills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-bottom: 20px;
      }

      .skill-tag {
        background: rgba(59, 130, 246, 0.2);
        border: 1px solid rgba(59, 130, 246, 0.5);
        color: #3b82f6;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 500;
        transition: all 0.3s ease;
      }

      .skill-tag:hover {
        background: rgba(59, 130, 246, 0.3);
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        transform: scale(1.05);
      }

      .social-links {
        display: flex;
        justify-content: center;
        gap: 15px;
      }

      .social-link {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: #94a3b8;
        transition: all 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .social-link:hover {
        background: rgba(59, 130, 246, 0.2);
        color: #3b82f6;
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
      }

      .stats-section {
        margin-top: 80px;
        text-align: center;
        padding: 60px 0;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 20px;
        backdrop-filter: blur(10px);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 40px;
        margin-top: 40px;
      }

      .stat-item {
        text-align: center;
      }

      .stat-number {
        font-size: 3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
      }

      .stat-label {
        color: #94a3b8;
        font-weight: 500;
      }

      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        .dao-logo {
          font-size: 2.5rem;
        }

        .hero-subtitle {
          font-size: 1.1rem;
        }

        .team-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .team-card {
          padding: 20px;
        }

        .stats-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 30px;
        }

        .stat-number {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>

    <script type="module">
      import {
        render,
        h
      } from 'https://unpkg.com/preact@10.19.3/dist/preact.module.js'
      import htm from 'https://unpkg.com/htm@3.1.1/dist/htm.module.js'

      const html = htm.bind(h)

      // Read teamMembers from the data island
      const teamMembersData = document.getElementById('data').textContent
      const teamMembers = JSON.parse(teamMembersData).teamMembers

      const TeamCard = ({ member }) => html`
        <div class="team-card">
          <div class="avatar">
            ${member.picture
              ? html`<img src="${member.picture}" alt="${member.name}" />`
              : member.avatar}

          <div class="skills">
            ${member.skills.map(
              skill => html` <span class="skill-tag">${skill}</span> `
            )}
          </div>
          <div class="social-links">
            <a
              href="${'https://nostr.rocks/user/' +

                <ellipse
                  cx="32"

                  rx="12"

                  stroke="#222"
                  stroke-width="2"
                />
                <ellipse
                  cx="32"
                  cy="24"
                  rx="6"
                  ry="3"
                  fill="#fff"
                  stroke="#222"
                  stroke-width="1"
                />
                <ellipse cx="32" cy="22" rx="2" ry="1" fill="#222" />
              </svg>
            </a>
            <a
              href="${'https://nostr.social/profile/' +
              (member.id ? member.id.replace('did:nostr:', '') : '')}"
              class="social-link"
              target="_blank"
              rel="noopener noreferrer"
              title="Nostr Profile"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <circle
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="2"
                  fill="none"
                />
                <path
                  d="M12 7a5 5 0 0 1 0 10a5 5 0 0 1 0-10z"
                  fill="currentColor"
                />
              </svg>
            </a>
          </div>
        </div>
      `

      const App = () => html`
        <div class="container">
          <header class="hero">
            <h1 class="dao-logo">NosDAV DAO</h1>
            <p class="hero-subtitle">Meet Our Team</p>
          </header>

          <main>
            <div class="team-grid">
              ${teamMembers.map(
                member => html`<${TeamCard} member=${member} />`
              )}
            </div>

            <section class="stats-section">
              <h2
                style="font-size: 2.5rem; margin-bottom: 20px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;"
              >
                Our Mission
              </h2>
              <p
                style="color: #94a3b8; font-size: 1.1rem; margin-bottom: 30px; max-width: 800px; margin: 0 auto; line-height: 1.7;"
              >
                Our diverse team combines expertise in technology and creativity
                to build innovative solutions powered by AI. We're dedicated to
                developing tools that connect people and enhance digital
                experiences.
              </p>
            </section>
          </main>
        </div>
      `

      render(html`<${App} />`, document.getElementById('app'))
    </script>

</html>
