<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(135deg, #e0f7fa 0%, #d8b5ff 100%);
        min-height: 100vh;
      }
      .todo-container {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }
      .todo-item {
        transition: all 0.3s ease;
      }
      .todo-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      import {
        h,
        render,
        Component
      } from 'https://unpkg.com/preact@10.13.1/dist/preact.module.js'
      import htm from 'https://unpkg.com/htm@3.1.1/dist/htm.module.js'
      import Navbar from './navbar.js'
      import './nosdav-shim.js'
      import * as secp256k1 from 'https://cdn.jsdelivr.net/npm/@noble/secp256k1@1.7.1/+esm'

      window.secp256k1 = secp256k1

      // Initialize htm with Preact
      const html = htm.bind(h)

      class TodoApp extends Component {
        constructor() {
          super()
          this.state = {
            todos: [],
            newTodo: '',
            storageType: ''
          }
        }

        componentDidMount() {
          // Add a small delay to ensure any URL hash login completes first
          setTimeout(() => {
            this.initializeStorage()
          }, 200)
        }

        // Storage handling
        getStorageProvider() {
          // Use nosdav.net directly as the primary storage solution
          console.log('Using nosdav.net as primary storage')
          return {
            type: 'nosdav',
            isPrimary: true,
            save: async data => {
              try {
                const pubkey = localStorage.getItem('pubkey')
                if (!pubkey) {
                  console.error('No pubkey found for nosdav storage')
                  return false
                }

                const url = `https://nosdav.net/${pubkey}/todos.json`
                const response = await fetch(url, {
                  method: 'PUT',
                  headers: {
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(data)
                })

                if (!response.ok) throw new Error('Network response was not ok')
                console.log('Todos saved to nosdav successfully')
                return true
              } catch (e) {
                console.error('Error saving to nosdav:', e)
                // Fall back to localStorage if nosdav fails
                if (typeof localStorage !== 'undefined') {
                  try {
                    localStorage.setItem('todos', JSON.stringify(data))
                    console.log('Todos saved to localStorage as fallback')
                    return true
                  } catch (localErr) {
                    console.error('Error saving to localStorage:', localErr)
                  }
                }
                return false
              }
            },
            load: async () => {
              try {
                const pubkey = localStorage.getItem('pubkey')
                if (!pubkey) {
                  console.error('No pubkey found for nosdav storage')
                  return []
                }

                const url = `https://nosdav.net/${pubkey}/todos.json`
                const response = await fetch(url)

                if (response.status === 404) {
                  return []
                }

                if (!response.ok) throw new Error('Network response was not ok')
                const todos = await response.json()
                return todos
              } catch (e) {
                console.error('Error loading from nosdav:', e)
                // Try to load from localStorage if nosdav fails
                if (typeof localStorage !== 'undefined') {
                  try {
                    const data = localStorage.getItem('todos')
                    if (data) {
                      console.log('Loaded todos from localStorage as fallback')
                      return JSON.parse(data)
                    }
                  } catch (localErr) {
                    console.error('Error loading from localStorage:', localErr)
                  }
                }
                return []
              }
            }
          }
        }

        async initializeStorage() {
          const storage = this.getStorageProvider()
          const todos = await storage.load()
          this.setState({
            todos,
            storageType: storage.type
          })
          console.log(`Todos loaded from ${storage.type}`)
        }

        async saveTodos(todos) {
          const storage = this.getStorageProvider()
          await storage.save(todos)
          console.log(`Todos saved to ${storage.type}`)
        }

        handleInputChange = e => {
          this.setState({ newTodo: e.target.value })
        }

        handleSubmit = e => {
          e.preventDefault()
          if (!this.state.newTodo.trim()) return

          const now = Date.now()
          const newTodos = [
            ...this.state.todos,
            {
              '@id': `#${Math.floor(now / 1000)}.${now % 1000}`,
              '@type': 'Task',
              text: this.state.newTodo,
              completed: false
            }
          ]

          this.setState({
            todos: newTodos,
            newTodo: ''
          })

          this.saveTodos(newTodos)
        }

        toggleTodo = id => {
          const newTodos = this.state.todos.map(todo =>
            todo['@id'] === id ? { ...todo, completed: !todo.completed } : todo
          )

          this.setState({ todos: newTodos })
          this.saveTodos(newTodos)
        }

        removeTodo = id => {
          const newTodos = this.state.todos.filter(todo => todo['@id'] !== id)

          this.setState({ todos: newTodos })
          this.saveTodos(newTodos)
        }

        openStorageFile = () => {
          const pubkey = localStorage.getItem('pubkey')
          if (pubkey) {
            const url = `https://nosdav.net/${pubkey}/todos.json`
            window.open(url, '_blank')
          } else {
            alert('No pubkey found. Cannot open storage file.')
          }
        }

        render() {
          return html`
            <div class="min-h-screen flex flex-col">
              <${Navbar} />

              <div
                class="container mx-auto px-4 py-8 flex-grow flex flex-col items-center"
              >
                <div class="todo-container w-full max-w-md p-6 my-8">
                  <h1
                    class="text-3xl font-bold text-center mb-8 text-purple-700"
                  >
                    Todo List
                  </h1>

                  <form onSubmit=${this.handleSubmit} class="mb-6">
                    <div class="flex items-center">
                      <input
                        type="text"
                        value=${this.state.newTodo}
                        onInput=${this.handleInputChange}
                        placeholder="Add a new task..."
                        class="flex-grow p-3 border border-blue-200 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-300"
                      />
                      <button
                        type="submit"
                        class="bg-gradient-to-r from-blue-400 to-purple-500 text-white p-3 rounded-r-lg hover:opacity-90 transition-opacity"
                      >
                        Add
                      </button>
                    </div>
                  </form>

                  <div class="space-y-3">
                    ${this.state.todos.length === 0
                      ? html`<p class="text-center text-gray-500">
                          No tasks yet. Add one above!
                        </p>`
                      : this.state.todos.map(
                          todo => html`
                            <div
                              key=${todo['@id']}
                              class="todo-item flex items-center justify-between p-3 bg-white rounded-lg border-l-4 ${todo.completed
                                ? 'border-green-400'
                                : 'border-blue-400'}"
                            >
                              <div class="flex items-center">
                                <input
                                  type="checkbox"
                                  checked=${todo.completed}
                                  onChange=${() => this.toggleTodo(todo['@id'])}
                                  class="mr-3 h-5 w-5 text-purple-500 rounded focus:ring-purple-400"
                                />
                                <span
                                  class=${todo.completed
                                    ? 'line-through text-gray-400'
                                    : 'text-gray-800'}
                                >
                                  ${todo.text}
                                  <a
                                    href=${`./mindstr.html?map=https://nosdav.net/${localStorage.getItem(
                                      'pubkey'
                                    )}/mm/${
                                      todo['@id']
                                        ? todo['@id'].substring(1)
                                        : ''
                                    }.mm&title=${encodeURIComponent(
                                      todo.text
                                    )}`}
                                    target="_blank"
                                    class="ml-2 text-blue-500 hover:text-blue-700"
                                    title="Open in Mindstr"
                                  >
                                    <svg
                                      xmlns="http://www.w3.org/2000/svg"
                                      class="h-4 w-4 inline"
                                      fill="none"
                                      viewBox="0 0 24 24"
                                      stroke="currentColor"
                                    >
                                      <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
                                      />
                                    </svg>
                                  </a>
                                </span>
                              </div>
                              <button
                                onClick=${() => this.removeTodo(todo['@id'])}
                                class="text-red-500 hover:text-red-700 focus:outline-none"
                                aria-label="Delete todo"
                              >
                                <svg
                                  xmlns="http://www.w3.org/2000/svg"
                                  class="h-5 w-5"
                                  fill="none"
                                  viewBox="0 0 24 24"
                                  stroke="currentColor"
                                >
                                  <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                                  />
                                </svg>
                              </button>
                            </div>
                          `
                        )}
                  </div>

                  <div class="mt-6 text-center text-sm text-gray-500">
                    ${this.state.storageType === 'nosdav'
                      ? html`<div
                          class="text-green-600 bg-green-100 rounded-full px-3 py-1 inline-block"
                        >
                          Using nosdav cloud storage
                          <button
                            onClick=${this.openStorageFile}
                            class="ml-2 bg-blue-500 hover:bg-blue-600 text-white rounded-full px-2 py-0.5 text-xs"
                            title="Open storage file in new tab"
                          >
                            View File
                          </button>
                        </div>`
                      : html`<div
                          class="text-yellow-600 bg-yellow-100 rounded-full px-3 py-1 inline-block"
                        >
                          Using ${this.state.storageType} storage (nosdav not
                          available)
                        </div>`}
                  </div>
                </div>
              </div>
            </div>
          `
        }
      }

      render(html`<${TodoApp} />`, document.getElementById('app'))
    </script>
  </body>
</html>
