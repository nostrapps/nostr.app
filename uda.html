<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFT Showcase</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "DigitalDocument",
        "name": "Voilin",
        "creator": {
          "@type": "Person",
          "name": "FOAF Labs"
        },
        "description": "A high-end cinematic product shot of a futuristic violin designed with polished wood accents and advanced tech features. The violin body merges dark varnished mahogany with glowing translucent polymer panels. Light-emitting strings stretch over a hybrid tech-wood bridge, and small interactive buttons are embedded near the chinrest and tuning pegs. The bow rests nearby, featuring a glowing smart ribbon. The prop is showcased on a black studio surface with dramatic lighting, elegant shadows, and high contrast detail. Photorealistic, professional concept photography style.",
        "image": "https://nosdav.net/c3e1d836e279b52ebdf309a4bfb3e18715995cc292604bd7054ee553d8c23473/public/images/voilin.png",
        "dateCreated": "2025",
        "contentUrl": "txo:btc:7a96034dd6ed9c0e4c7eb9e7f9a2e657b6c0433ce9562d54be0bcbc38b0e3a68:0?amount=21001",
        "identifier": "txo:btc:7a96034dd6ed9c0e4c7eb9e7f9a2e657b6c0433ce9562d54be0bcbc38b0e3a68:0?amount=21001",
        "contentSize": "21001",
        "isPartOf": {
          "@type": "Collection",
          "name": "NFT Gallery",
          "collectionSize": 1
        },
        "offers": {
          "@type": "Offer",
          "price": "2100000",
          "priceCurrency": "Satoshi",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
    <script src="https://unpkg.com/preact@10.13.1/dist/preact.min.js"></script>
    <script src="https://unpkg.com/preact@10.13.1/hooks/dist/hooks.umd.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95'
              },
              secondary: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a'
              },
              neutral: {
                50: '#fafafa',
                100: '#f5f5f5',
                200: '#e5e5e5',
                300: '#d4d4d4',
                400: '#a3a3a3',
                500: '#737373',
                600: '#525252',
                700: '#404040',
                800: '#262626',
                900: '#171717'
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8f7ff;
      }

      .glow {
        box-shadow: 0 0 25px rgba(139, 92, 246, 0.15);
        transition: all 0.3s ease;
      }

      .glow:hover {
        box-shadow: 0 0 35px rgba(139, 92, 246, 0.25);
        transform: translateY(-5px);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      const { h, render } = preact
      const html = htm.bind(h)
      const { useState, useEffect } = preactHooks

      const App = () => {
        const [loading, setLoading] = useState(true)
        const [nft, setNft] = useState(null)

        useEffect(() => {
          // Get NFT data from the structured data island
          const ldJsonScript = document.querySelector(
            'script[type="application/ld+json"]'
          )
          if (ldJsonScript) {
            try {
              const ldData = JSON.parse(ldJsonScript.textContent)
              // Map schema.org properties to our NFT object structure
              const mappedNft = {
                title: ldData.name,
                artist: ldData.creator?.name || '',
                description: ldData.description,
                image: ldData.image,
                price: parseInt(ldData.offers?.price) || 0,
                edition: '1 of 1', // Default if not in schema
                created: ldData.dateCreated,
                txo: ldData.contentUrl
              }
              setNft(mappedNft)
            } catch (error) {
              console.error('Error parsing JSON-LD:', error)
            }
          }

          // Simulate loading
          setTimeout(() => setLoading(false), 1000)
        }, [])

        const formatSatoshis = sats => {
          return new Intl.NumberFormat().format(sats)
        }

        const getTxoAmount = txo => {
          const amountMatch = txo?.match(/\?amount=(\d+)/)
          return amountMatch ? parseInt(amountMatch[1]) : 0
        }

        if (loading || !nft) {
          return html`
            <div
              class="min-h-screen flex items-center justify-center bg-neutral-50"
            >
              <div class="animate-pulse flex flex-col items-center">
                <div class="w-24 h-24 rounded-full bg-primary-200"></div>
                <div class="mt-4 text-primary-600 text-xl">
                  Loading masterpiece...
                </div>
              </div>
            </div>
          `
        }

        return html`
          <div
            class="min-h-screen bg-gradient-to-br from-neutral-50 to-primary-50 py-12 px-4 sm:px-6 lg:px-8"
          >
            <header class="max-w-7xl mx-auto mb-12">
              <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold text-neutral-800">
                  NFT <span class="text-primary-600">Gallery</span>
                </h1>
                <nav>
                  <ul class="flex space-x-6">
                    <li>
                      <a
                        href="#"
                        class="text-neutral-600 hover:text-primary-600 transition-colors"
                        >Home</a
                      >
                    </li>
                    <li>
                      <a
                        href="#"
                        class="text-neutral-600 hover:text-primary-600 transition-colors"
                        >About</a
                      >
                    </li>
                    <li>
                      <a
                        href="#"
                        class="text-neutral-600 hover:text-primary-600 transition-colors"
                        >Contact</a
                      >
                    </li>
                  </ul>
                </nav>
              </div>
            </header>

            <main class="max-w-7xl mx-auto">
              <div
                class="bg-white rounded-2xl shadow-xl overflow-hidden glow max-w-5xl mx-auto"
              >
                <div class="md:flex">
                  <div class="md:w-1/2">
                    <div class="h-full relative">
                      <img
                        src=${nft.image}
                        alt=${nft.title}
                        class="w-full h-full object-cover"
                      />
                      <div
                        class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-sm font-medium text-primary-700"
                      >
                        ${nft.edition}
                      </div>
                    </div>
                  </div>
                  <div
                    class="md:w-1/2 p-8 md:p-12 flex flex-col justify-between"
                  >
                    <div>
                      <h2 class="text-3xl font-bold text-neutral-800 mb-2">
                        ${nft.title}
                      </h2>
                      <p class="text-neutral-500 mb-6">
                        <span class="text-primary-600 font-medium"
                          >${nft.artist}</span
                        >
                        • ${nft.created}
                      </p>

                      <div class="bg-primary-50 rounded-xl p-6 mb-8">
                        <p class="text-neutral-700 leading-relaxed">
                          ${nft.description}
                        </p>
                      </div>

                      <div class="mb-8">
                        <h3 class="text-lg font-semibold text-neutral-700 mb-2">
                          Details
                        </h3>
                        <div class="grid grid-cols-2 gap-4">
                          <div>
                            <p class="text-neutral-500 text-sm">Edition</p>
                            <p class="text-neutral-800 font-medium">
                              ${nft.edition}
                            </p>
                          </div>
                          <div>
                            <p class="text-neutral-500 text-sm">Created</p>
                            <p class="text-neutral-800 font-medium">
                              ${nft.created}
                            </p>
                          </div>
                        </div>

                        <div class="mt-4">
                          <p class="text-neutral-500 text-sm">
                            Blockchain Reference
                          </p>
                          <div class="bg-secondary-50 rounded-lg p-3 mt-1">
                            <p
                              class="text-neutral-800 text-sm font-mono truncate"
                            >
                              ${nft.txo}
                            </p>
                            <div class="flex justify-between mt-1">
                              <p class="text-neutral-800 text-sm">
                                Value: ${formatSatoshis(getTxoAmount(nft.txo))}
                              </p>
                              <a
                                href="https://mempool.space/tx/${nft.txo.split(
                                  ':'
                                )[2]}"
                                target="_blank"
                                class="text-primary-600 hover:text-primary-700 text-xs inline-block transition-colors"
                              >
                                View on Block Explorer →
                              </a>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="border-t border-neutral-200 pt-6">
                      <div class="flex justify-between items-end mb-6">
                        <div>
                          <p class="text-neutral-500 text-sm">Current price</p>
                          <p class="text-3xl font-bold text-neutral-800">
                            ${formatSatoshis(nft.price)}
                            <span class="text-sm font-normal text-neutral-500"
                              >satoshis</span
                            >
                          </p>
                        </div>
                        <div class="text-right">
                          <p class="text-neutral-500 text-sm">≈ 0.021 BTC</p>
                        </div>
                      </div>

                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <button
                          class="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium py-3 px-4 rounded-lg transition-colors"
                        >
                          Buy now
                        </button>
                        <button
                          class="w-full bg-white border border-primary-600 text-primary-600 hover:bg-primary-50 font-medium py-3 px-4 rounded-lg transition-colors"
                        >
                          Make offer
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </main>

            <footer
              class="max-w-7xl mx-auto mt-16 text-center text-neutral-500 text-sm"
            >
              <p>© 2025 NFT Gallery. All rights reserved.</p>
            </footer>
          </div>
        `
      }

      render(html`<${App} />`, document.getElementById('app'))
    </script>
  </body>
</html>
