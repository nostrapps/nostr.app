<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NFT Showcase</title>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
    <script src="https://unpkg.com/preact@10.13.1/dist/preact.min.js"></script>
    <script src="https://unpkg.com/preact@10.13.1/hooks/dist/hooks.umd.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95'
              },
              secondary: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a'
              },
              neutral: {
                50: '#fafafa',
                100: '#f5f5f5',
                200: '#e5e5e5',
                300: '#d4d4d4',
                400: '#a3a3a3',
                500: '#737373',
                600: '#525252',
                700: '#404040',
                800: '#262626',
                900: '#171717'
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8f7ff;
      }

      .glow {
        box-shadow: 0 0 25px rgba(139, 92, 246, 0.15);
        transition: all 0.3s ease;
      }

      .glow:hover {
        box-shadow: 0 0 35px rgba(139, 92, 246, 0.25);
        transform: translateY(-5px);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      const { h, render } = preact
      const html = htm.bind(h)
      const { useState, useEffect } = preactHooks

      const App = () => {
        const [loading, setLoading] = useState(true)

        useEffect(() => {
          // Simulate loading
          setTimeout(() => setLoading(false), 1000)
        }, [])

        const nft = {
          title: 'Stone Tiger',
          artist: 'Digital Dreams ',
          description:
            "A striking sculpture of a tiger's face meticulously crafted from natural stones and pebbles. Each carefully placed stone contributes to the fierce yet elegant expression, creating a powerful piece that blends natural materials with artistic vision.",
          image:
            'https://nosdav.net/9683cc031577d1fb63b22f0c8a2ef22aceaa7bc3900fbdd6585555b1e6350f96/public/images/tiger.png',
          price: 2100000, // 2.1M satoshis (0.021 BTC)
          edition: '1 of 1',
          created: '2025'
        }

        const formatSatoshis = sats => {
          return new Intl.NumberFormat().format(sats)
        }

        if (loading) {
          return html`
            <div
              class="min-h-screen flex items-center justify-center bg-neutral-50"
            >
              <div class="animate-pulse flex flex-col items-center">
                <div class="w-24 h-24 rounded-full bg-primary-200"></div>
                <div class="mt-4 text-primary-600 text-xl">
                  Loading masterpiece...
                </div>
              </div>
            </div>
          `
        }

        return html`
          <div
            class="min-h-screen bg-gradient-to-br from-neutral-50 to-primary-50 py-12 px-4 sm:px-6 lg:px-8"
          >
            <header class="max-w-7xl mx-auto mb-12">
              <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold text-neutral-800">
                  NFT <span class="text-primary-600">Gallery</span>
                </h1>
                <nav>
                  <ul class="flex space-x-6">
                    <li>
                      <a
                        href="#"
                        class="text-neutral-600 hover:text-primary-600 transition-colors"
                        >Home</a
                      >
                    </li>
                    <li>
                      <a
                        href="#"
                        class="text-neutral-600 hover:text-primary-600 transition-colors"
                        >About</a
                      >
                    </li>
                    <li>
                      <a
                        href="#"
                        class="text-neutral-600 hover:text-primary-600 transition-colors"
                        >Contact</a
                      >
                    </li>
                  </ul>
                </nav>
              </div>
            </header>

            <main class="max-w-7xl mx-auto">
              <div
                class="bg-white rounded-2xl shadow-xl overflow-hidden glow max-w-5xl mx-auto"
              >
                <div class="md:flex">
                  <div class="md:w-1/2">
                    <div class="h-full relative">
                      <img
                        src=${nft.image}
                        alt=${nft.title}
                        class="w-full h-full object-cover"
                      />
                      <div
                        class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-sm font-medium text-primary-700"
                      >
                        ${nft.edition}
                      </div>
                    </div>
                  </div>
                  <div
                    class="md:w-1/2 p-8 md:p-12 flex flex-col justify-between"
                  >
                    <div>
                      <h2 class="text-3xl font-bold text-neutral-800 mb-2">
                        ${nft.title}
                      </h2>
                      <p class="text-neutral-500 mb-6">
                        <span class="text-primary-600 font-medium"
                          >${nft.artist}</span
                        >
                        • ${nft.created}
                      </p>

                      <div class="bg-primary-50 rounded-xl p-6 mb-8">
                        <p class="text-neutral-700 leading-relaxed">
                          ${nft.description}
                        </p>
                      </div>

                      <div class="mb-8">
                        <h3 class="text-lg font-semibold text-neutral-700 mb-2">
                          Details
                        </h3>
                        <div class="grid grid-cols-2 gap-4">
                          <div>
                            <p class="text-neutral-500 text-sm">Edition</p>
                            <p class="text-neutral-800 font-medium">
                              ${nft.edition}
                            </p>
                          </div>
                          <div>
                            <p class="text-neutral-500 text-sm">Created</p>
                            <p class="text-neutral-800 font-medium">
                              ${nft.created}
                            </p>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="border-t border-neutral-200 pt-6">
                      <div class="flex justify-between items-end mb-6">
                        <div>
                          <p class="text-neutral-500 text-sm">Current price</p>
                          <p class="text-3xl font-bold text-neutral-800">
                            ${formatSatoshis(nft.price)}
                            <span class="text-sm font-normal text-neutral-500"
                              >satoshis</span
                            >
                          </p>
                        </div>
                        <div class="text-right">
                          <p class="text-neutral-500 text-sm">≈ 0.021 BTC</p>
                        </div>
                      </div>

                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <button
                          class="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium py-3 px-4 rounded-lg transition-colors"
                        >
                          Buy now
                        </button>
                        <button
                          class="w-full bg-white border border-primary-600 text-primary-600 hover:bg-primary-50 font-medium py-3 px-4 rounded-lg transition-colors"
                        >
                          Make offer
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </main>

            <footer
              class="max-w-7xl mx-auto mt-16 text-center text-neutral-500 text-sm"
            >
              <p>© 2025 NFT Gallery. All rights reserved.</p>
            </footer>
          </div>
        `
      }

      render(html`<${App} />`, document.getElementById('app'))
    </script>
  </body>
</html>
