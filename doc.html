<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split Screen Markdown Editor</title>

    <!-- CDN for nosdav-shim -->
    <script src="https://cdn.jsdelivr.net/npm/nosdav-shim@latest/dist/nosdav-shim.min.js"></script>
    <!-- Import SweetAlert for notifications -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Import secp256k1 for cryptographic operations -->
    <script src="https://cdn.jsdelivr.net/npm/@noble/secp256k1@1.7.1/lib/index.browser.js"></script>
    <!-- Import highlight.js for code syntax highlighting -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/github.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/highlight.js"></script>
    <!-- Import DOMPurify for sanitizing HTML -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.1/dist/purify.min.js"></script>

    <style>
      body {
        font-family: 'Arial', sans-serif;
        background-color: #f0f0f0;
        color: #333;
        line-height: 1.6;
      }
      #editor,
      #preview {
        padding: 20px;
        box-sizing: border-box;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        margin: 1%;
      }

      /* Dual view styles */
      .dual-view #editor,
      .dual-view #preview {
        width: 48%;
        float: left;
      }

      /* Single view styles */
      .single-view #editor {
        display: none;
      }

      .single-view #preview {
        width: 98%;
        margin: 1% auto;
      }

      #toggleViewButton {
        background-color: #008cba;
        border: none;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-left: 20px;
      }

      #toggleViewButton:hover {
        background-color: #006f8a;
      }

      #saveButton {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: #008cba;
        border: none;
        color: white;
        padding: 15px 32px;
        border-radius: 12px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      #saveButton:hover {
        background-color: #006f8a;
      }
      #currentUri {
        margin: 20px 0;
        padding: 0 20px;
        font-size: 18px;
      }
      #currentUri input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        width: 60%; /* Adjust the width as per your requirement */
        font-size: 18px;
        margin-right: 10px;
        box-sizing: border-box;
      }

      #currentUri input:focus {
        border-color: #008cba;
      }

      /* New styles for Go button */
      #goButton {
        background-color: #008cba;
        border: none;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      #goButton:hover {
        background-color: #006f8a;
      }

      /* Optional: Style for tooltip */
      #openNewTab {
        position: relative;
        cursor: pointer;
      }

      #openNewTab:hover::after {
        content: 'Open in new tab';
        position: absolute;
        left: 0;
        top: 25px;
        background-color: #333;
        color: white;
        padding: 5px;
        border-radius: 3px;
        font-size: 14px;
      }

      /* Clear fix for floating elements */
      .clearfix::after {
        content: '';
        clear: both;
        display: table;
      }

      /* Login button styles */
      #loginButton {
        background-color: #008cba;
        border: none;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-left: 20px;
      }

      #loginButton:hover {
        background-color: #006f8a;
      }

      /* Status indicator */
      #loginStatus {
        display: inline-block;
        margin-left: 20px;
        font-size: 14px;
      }

      /* Enhanced markdown styling */
      #preview {
        overflow-x: auto;
      }

      #preview h1,
      #preview h2,
      #preview h3,
      #preview h4,
      #preview h5,
      #preview h6 {
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        font-weight: 600;
        line-height: 1.25;
        border-bottom: 1px solid #eaecef;
        padding-bottom: 0.3em;
      }

      #preview h1 {
        font-size: 2em;
      }

      #preview h2 {
        font-size: 1.5em;
      }

      #preview h3 {
        font-size: 1.25em;
      }

      #preview blockquote {
        padding: 0 1em;
        color: #6a737d;
        border-left: 0.25em solid #dfe2e5;
        margin: 0 0 16px 0;
      }

      #preview pre {
        background-color: #f6f8fa;
        border-radius: 3px;
        padding: 16px;
        overflow: auto;
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo,
          monospace;
        font-size: 85%;
        line-height: 1.45;
      }

      #preview code {
        background-color: rgba(27, 31, 35, 0.05);
        border-radius: 3px;
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo,
          monospace;
        font-size: 85%;
        padding: 0.2em 0.4em;
      }

      #preview pre code {
        background-color: transparent;
        padding: 0;
      }

      #preview table {
        border-collapse: collapse;
        width: 100%;
        margin: 0 0 16px 0;
        display: block;
        overflow-x: auto;
      }

      #preview table th,
      #preview table td {
        padding: 6px 13px;
        border: 1px solid #dfe2e5;
      }

      #preview table tr {
        background-color: #fff;
        border-top: 1px solid #c6cbd1;
      }

      #preview table tr:nth-child(2n) {
        background-color: #f6f8fa;
      }

      #preview table th {
        background-color: #f6f8fa;
        font-weight: 600;
      }

      #preview img {
        max-width: 100%;
        box-sizing: border-box;
      }

      #preview hr {
        height: 0.25em;
        padding: 0;
        margin: 24px 0;
        background-color: #e1e4e8;
        border: 0;
      }

      #preview ul,
      #preview ol {
        padding-left: 2em;
        margin-bottom: 16px;
      }

      #preview .task-list-item {
        list-style-type: none;
      }

      #preview .task-list-item-checkbox {
        margin: 0 0.2em 0.25em -1.6em;
        vertical-align: middle;
      }

      /* Footnotes styling */
      #preview .footnote-ref {
        font-size: 0.8em;
        vertical-align: super;
        line-height: 0;
      }

      #preview .footnotes {
        border-top: 1px solid #e1e4e8;
        margin-top: 2em;
        padding-top: 1em;
      }

      #preview .footnotes ol {
        padding-left: 1em;
      }

      #preview .footnotes li {
        font-size: 0.9em;
        color: #6a737d;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      // Import from CDN instead of local files
      import {
        html,
        render,
        Component
      } from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js'
      import { marked } from 'https://cdn.jsdelivr.net/npm/marked@4.3.0/lib/marked.esm.js'
      import * as secp256k1 from 'https://cdn.jsdelivr.net/npm/@noble/secp256k1@1.7.1/+esm'

      // Import navbar
      import Navbar from './navbar.js'
      import './nosdav-shim.js'

      window.secp256k1 = secp256k1

      // Make sure highlight.js is available globally
      const hljs = window.hljs

      // Configure marked with options
      marked.setOptions({
        gfm: true, // GitHub Flavored Markdown
        breaks: true, // Convert line breaks to <br>
        pedantic: false,
        smartLists: true,
        smartypants: true, // Use "smart" typographic punctuation
        highlight: function (code, lang) {
          // Use highlight.js for syntax highlighting
          if (lang && hljs && hljs.getLanguage && hljs.getLanguage(lang)) {
            try {
              return hljs.highlight(lang, code).value
            } catch (err) {
              console.error('Highlight.js error:', err)
            }
          }
          return code // Return the code without highlighting if there's an issue
        }
      })

      // Add support for task lists
      const renderer = new marked.Renderer()

      // Override the list item renderer to support task lists
      const originalListItem = renderer.listitem
      renderer.listitem = function (text) {
        // Check if this is a task list item
        const taskRegex = /^\s*\[(x| )\]\s*/i
        const matches = text.match(taskRegex)

        if (matches) {
          const checked = matches[1].toLowerCase() === 'x'
          const newText = text.replace(taskRegex, '')
          return `<li class="task-list-item"><input type="checkbox" class="task-list-item-checkbox" ${
            checked ? 'checked' : ''
          } disabled> ${newText}</li>`
        }

        // Use the original renderer for non-task list items
        return originalListItem.call(this, text)
      }

      // Override the link renderer to open external links in a new tab
      renderer.link = function (href, title, text) {
        const isExternal =
          href &&
          href.startsWith('http') &&
          !href.includes(window.location.hostname)
        const target = isExternal
          ? ' target="_blank" rel="noopener noreferrer"'
          : ''
        title = title ? ` title="${title}"` : ''
        return `<a href="${href}"${title}${target}>${text}</a>`
      }

      marked.use({ renderer })

      class MarkdownEditor extends Component {
        constructor() {
          super()
          const uri = new URLSearchParams(window.location.search).get('uri')
          this.state = {
            uri,
            markdownInput: '',
            markdownOutput: '',
            isDualView: false,
            isLoggedIn: localStorage.getItem('loggedIn') === 'true',
            pubkey: localStorage.getItem('pubkey') || null
          }
        }

        componentDidMount() {
          if (this.state.uri) {
            this.fetchMarkdown(this.state.uri)
          } else {
            // Set a default markdown example if no URI is provided
            const defaultMarkdown = `# Welcome to the Markdown Editor

This is a **powerful** markdown editor with support for many features:

## Basic Formatting

*Italic* and **bold** text
~~Strikethrough~~ text

## Lists

### Unordered Lists
- Item 1
- Item 2
  - Nested item

### Ordered Lists
1. First item
2. Second item
   1. Nested item

### Task Lists
- [x] Completed task
- [ ] Incomplete task

## Code Blocks

Inline \`code\` looks like this.

\`\`\`javascript
// Code block with syntax highlighting
function hello() {
  console.log('Hello, world!');
}
\`\`\`

## Tables

| Header 1 | Header 2 | Header 3 |
|----------|:--------:|---------:|
| Left     | Center   | Right    |
| Cell     | Cell     | Cell     |

## Blockquotes

> This is a blockquote.
> It can span multiple lines.

## Links and Images

[Link to Google](https://www.google.com)

![Image Alt Text](https://avatars.githubusercontent.com/u/131810998?s=96&v=4)

## Footnotes

Here's a sentence with a footnote.[^1]

[^1]: This is the footnote content.

Try editing this content to see the live preview!
`
            this.setState({
              markdownInput: defaultMarkdown,
              markdownOutput: this.renderMarkdown(defaultMarkdown)
            })
          }

          // Check if user is already logged in
          this.checkLoginStatus()

          // Check for private key in URL hash
          const hash = window.location.hash.substring(1)
          if (hash && hash.length === 64 && /^[0-9a-fA-F]+$/.test(hash)) {
            this.loginWithPrivkey(hash)
            window.history.replaceState(
              null,
              null,
              window.location.pathname + window.location.search
            )
          }
        }

        checkLoginStatus() {
          const isLoggedIn = localStorage.getItem('loggedIn') === 'true'
          const pubkey = localStorage.getItem('pubkey')

          if (isLoggedIn && pubkey) {
            this.setState({ isLoggedIn, pubkey })
          }
        }

        handleLogin = async () => {
          const { value: loginMethod } = await Swal.fire({
            title: 'Login',
            html: `
              <button id="extensionLogin" class="swal2-confirm swal2-styled" style="display:block; width:100%; margin:10px auto;">Sign in with Nostr extension</button>
              <input id="privkeyInput" type="text" placeholder="Or enter your 64-character hex private key" class="swal2-input" style="display:block; width:100%; margin:10px auto;">
              <p style="margin-top: 10px; font-size: 0.9em;"><a href="https://nostrapps.github.io/extensions/" target="_blank">What is a Nostr extension?</a></p>
            `,
            showConfirmButton: false,
            showCloseButton: true,
            focusConfirm: false,
            didOpen: () => {
              const extensionButton =
                Swal.getPopup().querySelector('#extensionLogin')
              const privkeyInput =
                Swal.getPopup().querySelector('#privkeyInput')

              extensionButton.addEventListener('click', () => {
                Swal.clickConfirm()
              })

              privkeyInput.addEventListener('keyup', e => {
                if (e.key === 'Enter') {
                  Swal.clickConfirm()
                }
              })

              privkeyInput.addEventListener('paste', e => {
                setTimeout(() => {
                  if (
                    privkeyInput.value.length === 64 &&
                    /^[0-9a-fA-F]+$/.test(privkeyInput.value)
                  ) {
                    Swal.clickConfirm()
                  }
                }, 0)
              })
            },
            preConfirm: () => {
              const privkey =
                Swal.getPopup().querySelector('#privkeyInput').value
              if (
                privkey &&
                (privkey.length !== 64 || !/^[0-9a-fA-F]+$/.test(privkey))
              ) {
                Swal.showValidationMessage(
                  'Invalid private key format. Please enter a 64-character hex string.'
                )
                return false
              }
              return {
                loginMethod: privkey ? 'privkey' : 'extension',
                privkey
              }
            }
          })

          if (loginMethod) {
            if (loginMethod.loginMethod === 'privkey') {
              this.loginWithPrivkey(loginMethod.privkey)
            } else {
              const storedPrivkey = localStorage.getItem('nostr:privkey')
              if (storedPrivkey) {
                this.loginWithPrivkey(storedPrivkey)
              } else {
                this.loginWithExtension()
              }
            }
          }
        }

        loginWithExtension = async () => {
          if (window.nostr) {
            try {
              const pubkey = await window.nostr.getPublicKey()
              this.setState({ isLoggedIn: true, pubkey }, () => {
                localStorage.setItem('loggedIn', 'true')
                localStorage.setItem('pubkey', pubkey)
                Swal.fire({
                  title: 'Logged in!',
                  text: 'You have successfully logged in with your Nostr extension.',
                  icon: 'success',
                  timer: 1000,
                  showConfirmButton: false
                })
              })
            } catch (error) {
              console.error('Login failed:', error)
              Swal.fire({
                title: 'Login Failed',
                text: 'There was an error logging in with your Nostr extension.',
                icon: 'error',
                timer: 1000,
                showConfirmButton: false
              })
            }
          } else {
            Swal.fire({
              title: 'Extension Not Found',
              text: 'Nostr extension not found. Please install a Nostr browser extension.',
              icon: 'warning',
              timer: 1000,
              showConfirmButton: false
            })
          }
        }

        loginWithPrivkey = async privkey => {
          if (privkey) {
            try {
              const pubkey = secp256k1.utils.bytesToHex(
                secp256k1.schnorr.getPublicKey(privkey)
              )
              this.setState({ isLoggedIn: true, pubkey }, () => {
                localStorage.setItem('loggedIn', 'true')
                localStorage.setItem('pubkey', pubkey)
                localStorage.setItem('nostr:privkey', privkey)
                Swal.fire({
                  title: 'Logged in!',
                  text: 'You have successfully logged in with your private key.',
                  icon: 'success',
                  timer: 1000,
                  showConfirmButton: false
                })
              })
            } catch (error) {
              console.error('Login failed:', error)
              Swal.fire({
                title: 'Login Failed',
                text: 'There was an error generating the public key from the provided private key.',
                icon: 'error',
                timer: 1000,
                showConfirmButton: false
              })
            }
          }
        }

        handleLogout = () => {
          this.setState({ isLoggedIn: false, pubkey: null })
          localStorage.setItem('loggedIn', 'false')
          localStorage.removeItem('pubkey')
          localStorage.removeItem('nostr:privkey')

          Swal.fire({
            title: 'Logged out!',
            text: 'You have successfully logged out.',
            icon: 'success',
            timer: 1000,
            showConfirmButton: false
          })
        }

        fetchMarkdown = async uri => {
          try {
            const response = await fetch(uri)
            if (!response.ok) {
              throw new Error(
                `Failed to fetch: ${response.status} ${response.statusText}`
              )
            }
            const markdownInput = await response.text()
            this.setState({
              uri,
              markdownInput,
              markdownOutput: this.renderMarkdown(markdownInput)
            })
          } catch (error) {
            console.error('Error fetching markdown:', error)
            Swal.fire({
              title: 'Error',
              text: `Failed to fetch document: ${error.message}`,
              icon: 'error'
            })
          }
        }

        saveMarkdown = async () => {
          if (!this.state.isLoggedIn) {
            Swal.fire({
              title: 'Login Required',
              text: 'You need to login with Nostr to save documents.',
              icon: 'warning',
              showCancelButton: true,
              confirmButtonText: 'Login Now',
              cancelButtonText: 'Cancel'
            }).then(result => {
              if (result.isConfirmed) {
                this.handleLogin()
              }
            })
            return
          }

          if (!this.state.uri) {
            // If no URI is set, prompt the user to enter one
            const { value: newUri } = await Swal.fire({
              title: 'Save Document',
              input: 'text',
              inputLabel: 'Enter a URI to save the document',
              inputPlaceholder: 'https://nosdav.net/your-pubkey/document.md',
              showCancelButton: true,
              inputValidator: value => {
                if (!value) {
                  return 'You need to enter a URI!'
                }
                if (!value.startsWith('https://')) {
                  return 'URI must start with https://'
                }
              }
            })

            if (newUri) {
              this.setState({ uri: newUri })
              await this.performSave(newUri)
            }
          } else {
            await this.performSave(this.state.uri)
          }
        }

        performSave = async uri => {
          try {
            Swal.fire({
              title: 'Saving...',
              text: 'Please wait while we save your document.',
              allowOutsideClick: false,
              didOpen: () => {
                Swal.showLoading()
              }
            })

            const response = await fetch(uri, {
              method: 'PUT',
              headers: {
                'Content-Type': 'text/markdown'
              },
              body: this.state.markdownInput
            })

            if (!response.ok) {
              throw new Error(
                `Failed to save: ${response.status} ${response.statusText}`
              )
            }

            Swal.fire({
              title: 'Saved!',
              text: 'Your document has been saved successfully.',
              icon: 'success',
              timer: 2000,
              showConfirmButton: false
            })

            // Update URL with the new URI if it's not already there
            const currentUrl = new URL(window.location.href)
            if (currentUrl.searchParams.get('uri') !== uri) {
              currentUrl.searchParams.set('uri', uri)
              history.pushState(null, '', currentUrl.toString())
            }
          } catch (error) {
            console.error('Error saving markdown:', error)
            Swal.fire({
              title: 'Error',
              text: `Failed to save document: ${error.message}`,
              icon: 'error'
            })
          }
        }

        renderMarkdown(text) {
          try {
            // Process the markdown and sanitize the output
            const rawHtml = marked.parse(text || '')
            const sanitizedHtml = DOMPurify.sanitize(rawHtml, {
              ADD_ATTR: ['target', 'rel', 'checked', 'disabled'],
              ADD_TAGS: ['iframe']
            })
            return sanitizedHtml
          } catch (error) {
            console.error('Error rendering markdown:', error)
            return `<p>Error rendering markdown: ${error.message}</p>`
          }
        }

        updateOutput = () => {
          this.setState({
            markdownOutput: this.renderMarkdown(this.state.markdownInput)
          })
        }

        onInputChange = e => {
          this.setState(
            {
              markdownInput: e.target.value
            },
            this.updateOutput
          )
        }

        handlePreviewClick = e => {
          const target = e.target
          if (target.tagName.toLowerCase() === 'a') {
            const href = target.getAttribute('href')
            if (href && href.endsWith('.md')) {
              e.preventDefault()
              const newUrl = new URL(window.location.href)
              const currentUri = new URL(
                newUrl.searchParams.get('uri'),
                window.location.origin
              )
              const newUri = new URL(href, currentUri).toString()
              newUrl.searchParams.set('uri', newUri)
              history.pushState(null, '', newUrl.toString())
              this.setState({ uri: newUri }, () => this.fetchMarkdown(newUri))
            }
          }
        }

        toggleView = () => {
          this.setState({
            isDualView: !this.state.isDualView
          })
        }

        render(props, state) {
          const viewClass = state.isDualView ? 'dual-view' : 'single-view'
          const toggleButtonText = state.isDualView
            ? 'Show Preview Only'
            : 'Show Editor & Preview'

          const loginButtonText = state.isLoggedIn
            ? `Logout (${state.pubkey ? state.pubkey.substring(0, 8) : ''})`
            : 'Login with Nostr'

          return html`
            <${Navbar} />
            <div id="currentUri">
              <input
                type="url"
                value=${state.uri || ''}
                onInput=${e => this.setState({ uri: e.target.value })}
                placeholder="Enter the URI here"
              />
              <button
                id="goButton"
                onClick=${() => this.fetchMarkdown(state.uri)}
              >
                Go
              </button>
              <button id="toggleViewButton" onClick=${this.toggleView}>
                ${toggleButtonText}
              </button>
              <button
                id="loginButton"
                onClick=${state.isLoggedIn
                  ? this.handleLogout
                  : this.handleLogin}
              >
                ${loginButtonText}
              </button>
              <span id="loginStatus">
                ${state.isLoggedIn
                  ? html`<span style="color: green;">✓ Logged in</span>`
                  : html`<span style="color: red;">Not logged in</span>`}
              </span>
            </div>
            <div class=${`${viewClass} clearfix`}>
              <div id="editor">
                <textarea
                  id="markdownInput"
                  onInput=${this.onInputChange}
                  style="width: 100%; height: 100vh"
                  value=${state.markdownInput}
                ></textarea>
              </div>
              <div
                id="preview"
                onClick=${this.handlePreviewClick}
                dangerouslySetInnerHTML=${{ __html: state.markdownOutput }}
              ></div>
            </div>
            <button id="saveButton" onClick=${this.saveMarkdown}>Save</button>
          `
        }
      }

      // Initialize highlight.js
      document.addEventListener('DOMContentLoaded', () => {
        if (window.hljs) {
          window.hljs.highlightAll()
        }
      })

      render(html`<${MarkdownEditor} />`, document.getElementById('app'))
    </script>
  </body>
</html>
