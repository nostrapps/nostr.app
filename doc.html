<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split Screen Markdown Editor</title>

    <!-- CDN for nosdav-shim -->
    <script src="https://cdn.jsdelivr.net/npm/nosdav-shim@latest/dist/nosdav-shim.min.js"></script>
    <!-- Import SweetAlert for notifications -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Import secp256k1 for cryptographic operations -->
    <script src="https://cdn.jsdelivr.net/npm/@noble/secp256k1@1.7.1/lib/index.browser.js"></script>

    <style>
      body {
        font-family: 'Arial', sans-serif;
        background-color: #f0f0f0;
        color: #333;
      }
      #editor,
      #preview {
        padding: 20px;
        box-sizing: border-box;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        margin: 1%;
      }

      /* Dual view styles */
      .dual-view #editor,
      .dual-view #preview {
        width: 48%;
        float: left;
      }

      /* Single view styles */
      .single-view #editor {
        display: none;
      }

      .single-view #preview {
        width: 98%;
        margin: 1% auto;
      }

      #toggleViewButton {
        background-color: #008cba;
        border: none;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-left: 20px;
      }

      #toggleViewButton:hover {
        background-color: #006f8a;
      }

      #saveButton {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: #008cba;
        border: none;
        color: white;
        padding: 15px 32px;
        border-radius: 12px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      #saveButton:hover {
        background-color: #006f8a;
      }
      #currentUri {
        margin: 20px 0;
        padding: 0 20px;
        font-size: 18px;
      }
      #currentUri input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        width: 60%; /* Adjust the width as per your requirement */
        font-size: 18px;
        margin-right: 10px;
        box-sizing: border-box;
      }

      #currentUri input:focus {
        border-color: #008cba;
      }

      /* New styles for Go button */
      #goButton {
        background-color: #008cba;
        border: none;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      #goButton:hover {
        background-color: #006f8a;
      }

      /* Optional: Style for tooltip */
      #openNewTab {
        position: relative;
        cursor: pointer;
      }

      #openNewTab:hover::after {
        content: 'Open in new tab';
        position: absolute;
        left: 0;
        top: 25px;
        background-color: #333;
        color: white;
        padding: 5px;
        border-radius: 3px;
        font-size: 14px;
      }

      /* Clear fix for floating elements */
      .clearfix::after {
        content: '';
        clear: both;
        display: table;
      }

      /* Login button styles */
      #loginButton {
        background-color: #008cba;
        border: none;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-left: 20px;
      }

      #loginButton:hover {
        background-color: #006f8a;
      }

      /* Status indicator */
      #loginStatus {
        display: inline-block;
        margin-left: 20px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      // Import from CDN instead of local files
      import {
        html,
        render,
        Component
      } from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js'
      import { marked } from 'https://cdn.jsdelivr.net/npm/marked@4.3.0/lib/marked.esm.js'
      import * as secp256k1 from 'https://cdn.jsdelivr.net/npm/@noble/secp256k1@1.7.1/+esm'

      // Import navbar
      import Navbar from './navbar.js'
      import './nosdav-shim.js'

      window.secp256k1 = secp256k1

      class MarkdownEditor extends Component {
        constructor() {
          super()
          const uri = new URLSearchParams(window.location.search).get('uri')
          this.state = {
            uri,
            markdownInput: '',
            markdownOutput: '',
            isDualView: false,
            isLoggedIn: localStorage.getItem('loggedIn') === 'true',
            pubkey: localStorage.getItem('pubkey') || null
          }
        }

        componentDidMount() {
          if (this.state.uri) {
            this.fetchMarkdown(this.state.uri)
          }

          // Check if user is already logged in
          this.checkLoginStatus()

          // Check for private key in URL hash
          const hash = window.location.hash.substring(1)
          if (hash && hash.length === 64 && /^[0-9a-fA-F]+$/.test(hash)) {
            this.loginWithPrivkey(hash)
            window.history.replaceState(
              null,
              null,
              window.location.pathname + window.location.search
            )
          }
        }

        checkLoginStatus() {
          const isLoggedIn = localStorage.getItem('loggedIn') === 'true'
          const pubkey = localStorage.getItem('pubkey')

          if (isLoggedIn && pubkey) {
            this.setState({ isLoggedIn, pubkey })
          }
        }

        handleLogin = async () => {
          const { value: loginMethod } = await Swal.fire({
            title: 'Login',
            html: `
              <button id="extensionLogin" class="swal2-confirm swal2-styled" style="display:block; width:100%; margin:10px auto;">Sign in with Nostr extension</button>
              <input id="privkeyInput" type="text" placeholder="Or enter your 64-character hex private key" class="swal2-input" style="display:block; width:100%; margin:10px auto;">
              <p style="margin-top: 10px; font-size: 0.9em;"><a href="https://nostrapps.github.io/extensions/" target="_blank">What is a Nostr extension?</a></p>
            `,
            showConfirmButton: false,
            showCloseButton: true,
            focusConfirm: false,
            didOpen: () => {
              const extensionButton =
                Swal.getPopup().querySelector('#extensionLogin')
              const privkeyInput =
                Swal.getPopup().querySelector('#privkeyInput')

              extensionButton.addEventListener('click', () => {
                Swal.clickConfirm()
              })

              privkeyInput.addEventListener('keyup', e => {
                if (e.key === 'Enter') {
                  Swal.clickConfirm()
                }
              })

              privkeyInput.addEventListener('paste', e => {
                setTimeout(() => {
                  if (
                    privkeyInput.value.length === 64 &&
                    /^[0-9a-fA-F]+$/.test(privkeyInput.value)
                  ) {
                    Swal.clickConfirm()
                  }
                }, 0)
              })
            },
            preConfirm: () => {
              const privkey =
                Swal.getPopup().querySelector('#privkeyInput').value
              if (
                privkey &&
                (privkey.length !== 64 || !/^[0-9a-fA-F]+$/.test(privkey))
              ) {
                Swal.showValidationMessage(
                  'Invalid private key format. Please enter a 64-character hex string.'
                )
                return false
              }
              return {
                loginMethod: privkey ? 'privkey' : 'extension',
                privkey
              }
            }
          })

          if (loginMethod) {
            if (loginMethod.loginMethod === 'privkey') {
              this.loginWithPrivkey(loginMethod.privkey)
            } else {
              const storedPrivkey = localStorage.getItem('nostr:privkey')
              if (storedPrivkey) {
                this.loginWithPrivkey(storedPrivkey)
              } else {
                this.loginWithExtension()
              }
            }
          }
        }

        loginWithExtension = async () => {
          if (window.nostr) {
            try {
              const pubkey = await window.nostr.getPublicKey()
              this.setState({ isLoggedIn: true, pubkey }, () => {
                localStorage.setItem('loggedIn', 'true')
                localStorage.setItem('pubkey', pubkey)
                Swal.fire({
                  title: 'Logged in!',
                  text: 'You have successfully logged in with your Nostr extension.',
                  icon: 'success',
                  timer: 1000,
                  showConfirmButton: false
                })
              })
            } catch (error) {
              console.error('Login failed:', error)
              Swal.fire({
                title: 'Login Failed',
                text: 'There was an error logging in with your Nostr extension.',
                icon: 'error',
                timer: 1000,
                showConfirmButton: false
              })
            }
          } else {
            Swal.fire({
              title: 'Extension Not Found',
              text: 'Nostr extension not found. Please install a Nostr browser extension.',
              icon: 'warning',
              timer: 1000,
              showConfirmButton: false
            })
          }
        }

        loginWithPrivkey = async privkey => {
          if (privkey) {
            try {
              const pubkey = secp256k1.utils.bytesToHex(
                secp256k1.schnorr.getPublicKey(privkey)
              )
              this.setState({ isLoggedIn: true, pubkey }, () => {
                localStorage.setItem('loggedIn', 'true')
                localStorage.setItem('pubkey', pubkey)
                localStorage.setItem('nostr:privkey', privkey)
                Swal.fire({
                  title: 'Logged in!',
                  text: 'You have successfully logged in with your private key.',
                  icon: 'success',
                  timer: 1000,
                  showConfirmButton: false
                })
              })
            } catch (error) {
              console.error('Login failed:', error)
              Swal.fire({
                title: 'Login Failed',
                text: 'There was an error generating the public key from the provided private key.',
                icon: 'error',
                timer: 1000,
                showConfirmButton: false
              })
            }
          }
        }

        handleLogout = () => {
          this.setState({ isLoggedIn: false, pubkey: null })
          localStorage.setItem('loggedIn', 'false')
          localStorage.removeItem('pubkey')
          localStorage.removeItem('nostr:privkey')

          Swal.fire({
            title: 'Logged out!',
            text: 'You have successfully logged out.',
            icon: 'success',
            timer: 1000,
            showConfirmButton: false
          })
        }

        fetchMarkdown = async uri => {
          try {
            const response = await fetch(uri)
            if (!response.ok) {
              throw new Error(
                `Failed to fetch: ${response.status} ${response.statusText}`
              )
            }
            const markdownInput = await response.text()
            this.setState({
              uri,
              markdownInput,
              markdownOutput: marked(markdownInput)
            })
          } catch (error) {
            console.error('Error fetching markdown:', error)
            Swal.fire({
              title: 'Error',
              text: `Failed to fetch document: ${error.message}`,
              icon: 'error'
            })
          }
        }

        saveMarkdown = async () => {
          if (!this.state.isLoggedIn) {
            Swal.fire({
              title: 'Login Required',
              text: 'You need to login with Nostr to save documents.',
              icon: 'warning',
              showCancelButton: true,
              confirmButtonText: 'Login Now',
              cancelButtonText: 'Cancel'
            }).then(result => {
              if (result.isConfirmed) {
                this.handleLogin()
              }
            })
            return
          }

          if (!this.state.uri) {
            // If no URI is set, prompt the user to enter one
            const { value: newUri } = await Swal.fire({
              title: 'Save Document',
              input: 'text',
              inputLabel: 'Enter a URI to save the document',
              inputPlaceholder: 'https://nosdav.net/your-pubkey/document.md',
              showCancelButton: true,
              inputValidator: value => {
                if (!value) {
                  return 'You need to enter a URI!'
                }
                if (!value.startsWith('https://')) {
                  return 'URI must start with https://'
                }
              }
            })

            if (newUri) {
              this.setState({ uri: newUri })
              await this.performSave(newUri)
            }
          } else {
            await this.performSave(this.state.uri)
          }
        }

        performSave = async uri => {
          try {
            Swal.fire({
              title: 'Saving...',
              text: 'Please wait while we save your document.',
              allowOutsideClick: false,
              didOpen: () => {
                Swal.showLoading()
              }
            })

            const response = await fetch(uri, {
              method: 'PUT',
              headers: {
                'Content-Type': 'text/markdown'
              },
              body: this.state.markdownInput
            })

            if (!response.ok) {
              throw new Error(
                `Failed to save: ${response.status} ${response.statusText}`
              )
            }

            Swal.fire({
              title: 'Saved!',
              text: 'Your document has been saved successfully.',
              icon: 'success',
              timer: 2000,
              showConfirmButton: false
            })

            // Update URL with the new URI if it's not already there
            const currentUrl = new URL(window.location.href)
            if (currentUrl.searchParams.get('uri') !== uri) {
              currentUrl.searchParams.set('uri', uri)
              history.pushState(null, '', currentUrl.toString())
            }
          } catch (error) {
            console.error('Error saving markdown:', error)
            Swal.fire({
              title: 'Error',
              text: `Failed to save document: ${error.message}`,
              icon: 'error'
            })
          }
        }

        updateOutput = () => {
          this.setState({
            markdownOutput: marked(this.state.markdownInput)
          })
        }

        onInputChange = e => {
          this.setState(
            {
              markdownInput: e.target.value
            },
            this.updateOutput
          )
        }

        handlePreviewClick = e => {
          const target = e.target
          if (target.tagName.toLowerCase() === 'a') {
            const href = target.getAttribute('href')
            if (href.endsWith('.md')) {
              e.preventDefault()
              const newUrl = new URL(window.location.href)
              const currentUri = new URL(
                newUrl.searchParams.get('uri'),
                window.location.origin
              )
              const newUri = new URL(href, currentUri).toString()
              newUrl.searchParams.set('uri', newUri)
              history.pushState(null, '', newUrl.toString())
              this.setState({ uri: newUri }, () => this.fetchMarkdown(newUri))
            }
          }
        }

        toggleView = () => {
          this.setState({
            isDualView: !this.state.isDualView
          })
        }

        render(props, state) {
          const viewClass = state.isDualView ? 'dual-view' : 'single-view'
          const toggleButtonText = state.isDualView
            ? 'Show Preview Only'
            : 'Show Editor & Preview'

          const loginButtonText = state.isLoggedIn
            ? `Logout (${state.pubkey ? state.pubkey.substring(0, 8) : ''})`
            : 'Login with Nostr'

          return html`
            <${Navbar} />
            <div id="currentUri">
              <input
                type="url"
                value=${state.uri}
                onInput=${e => this.setState({ uri: e.target.value })}
                placeholder="Enter the URI here"
              />
              <button
                id="goButton"
                onClick=${() => this.fetchMarkdown(state.uri)}
              >
                Go
              </button>
              <button id="toggleViewButton" onClick=${this.toggleView}>
                ${toggleButtonText}
              </button>
              <button
                id="loginButton"
                onClick=${state.isLoggedIn
                  ? this.handleLogout
                  : this.handleLogin}
              >
                ${loginButtonText}
              </button>
              <span id="loginStatus">
                ${state.isLoggedIn
                  ? html`<span style="color: green;">✓ Logged in</span>`
                  : html`<span style="color: red;">Not logged in</span>`}
              </span>
            </div>
            <div class=${`${viewClass} clearfix`}>
              <div id="editor">
                <textarea
                  id="markdownInput"
                  onInput=${this.onInputChange}
                  style="width: 100%; height: 100vh"
                  value=${state.markdownInput}
                ></textarea>
              </div>
              <div
                id="preview"
                onClick=${this.handlePreviewClick}
                dangerouslySetInnerHTML=${{ __html: state.markdownOutput }}
              ></div>
            </div>
            <button id="saveButton" onClick=${this.saveMarkdown}>Save</button>
          `
        }
      }

      render(html`<${MarkdownEditor} />`, document.getElementById('app'))
    </script>
  </body>
</html>
